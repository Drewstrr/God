<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>In memoriam Robi</title>
  <link rel="stylesheet" href="css/style.css?v=36">
  <style>
    body { background: #000; }
    .go { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #000; cursor: pointer; }
    .go button { font: 800 1.6rem 'Blackwood Gothic', serif; color: var(--gold-hi); background: rgba(20, 6, 9, 0.9); border: 1px solid var(--gold); padding: 16px 30px; cursor: pointer; }
    .again { position: fixed; right: 12px; bottom: 12px; z-index: 90; font: 600 0.95rem 'EB Garamond', serif; color: #8d7a7e; background: rgba(0, 0, 0, 0.4); border: 1px solid #3a2a2e; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body class="screen" data-phase="morning">
  <div class="go" id="go"><button>▶ Pornește (cu sunet)</button></div>
  <button class="again" id="again" hidden>↻ Revezi</button>
  <script type="module">
    // Cartonașul de doliu din joc, fără lumânări (și fără mușcătură): numele, anul și ultimele cuvinte,
    // cu pianul dramatic și cioara, ca dimineața după o noapte cu Contele.
    import * as sfx from './js/sfx.js';
    const NAME = 'Robi';
    const YEAR = '2016';
    const QUOTE = 'Eu nu vomit de la băutură.';
    let timers = [];
    const at = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));

    function run() {
      timers.forEach(clearTimeout); timers = [];
      document.querySelector('.mourn-card')?.remove();
      document.body.classList.remove('mourning');
      sfx.playMusic(null);
      // 0 s: întuneric, inima; 2 s: doliul; 4,5 s: numele, pianul; 7 s: citatul.
      [0.3, 1.2].forEach((t) => sfx.heartbeat(t, 0.8));
      at(2, () => {
        document.body.classList.add('mourning');
        sfx.playMusic('mourning');
      });
      at(4.5, () => {
        const card = document.createElement('div');
        card.className = 'mourn-card';
        card.innerHTML = `<div class="m-name">${NAME}</div><div class="m-date">${YEAR}</div><div class="m-epitaph"></div><div class="m-testament"></div>`;
        document.body.appendChild(card);
        requestAnimationFrame(() => card.classList.add('show'));
        sfx.deathPiano();
        sfx.crow(3.4, { distance: 0.3, pan: -0.2 });
      });
      at(7, () => {
        const el = document.querySelector('.mourn-card .m-testament');
        if (!el) return;
        const text = `Ultimele cuvinte: „${QUOTE}”`;
        let k = 0;
        const type = () => { if (k <= text.length && document.body.contains(el)) { el.textContent = text.slice(0, k++); timers.push(setTimeout(type, 55)); } };
        type();
      });
    }
    document.getElementById('go').addEventListener('click', () => {
      sfx.unlock();
      document.getElementById('go').remove();
      document.getElementById('again').hidden = false;
      setTimeout(run, 400);
    });
    document.getElementById('again').addEventListener('click', run);
  </script>
</body>
</html>
