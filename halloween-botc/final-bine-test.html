<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Finalul Binelui · test</title>
  <link rel="stylesheet" href="css/style.css?v=31">
  <style>
    .go { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #000; cursor: pointer; }
    .go button { font: 800 1.6rem 'Blackwood Gothic', serif; color: var(--gold-hi); background: rgba(20, 6, 9, 0.9); border: 1px solid var(--gold); padding: 16px 30px; cursor: pointer; }
    .again { position: fixed; right: 12px; bottom: 12px; z-index: 90; font: 600 0.95rem 'EB Garamond', serif; color: #8d7a7e; background: rgba(0, 0, 0, 0.4); border: 1px solid #3a2a2e; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body data-phase="end">
  <div class="screen-wrap" id="stage"></div>
  <div class="go" id="go"><button>▶ Pornește finalul (cu sunet)</button></div>
  <button class="again" id="again" hidden>↻ Revezi</button>
  <script type="module">
    // Exact ce face proiectorul când câștigă Binele: imaginea (js/triumph.js), sunetul victoriei,
    // apoi, după 11 secunde (după clopote), melodia balului din finalul jocului.
    import { triumph, clearTriumph } from './js/triumph.js';
    import * as sfx from './js/sfx.js';
    const stage = document.getElementById('stage');
    let musicTimer = null;
    function run() {
      clearTriumph();
      sfx.playMusic(null);
      clearTimeout(musicTimer);
      stage.innerHTML = `<div class="end good"><h1><span class="emo">🕯️</span> <span class="blood-text gold">Binele a învins</span></h1><p class="lead">Contele a fost nimicit.</p></div>`;
      triumph();
      sfx.goodWins();
      musicTimer = setTimeout(() => sfx.playMusic('ball', { fallback: 'glory' }), 11000);
    }
    document.getElementById('go').addEventListener('click', () => {
      sfx.unlock();
      document.getElementById('go').remove();
      document.getElementById('again').hidden = false;
      setTimeout(run, 300);
    });
    document.getElementById('again').addEventListener('click', run);
  </script>
</body>
</html>
