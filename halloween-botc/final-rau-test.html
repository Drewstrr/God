<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Finalul Răului · test</title>
  <link rel="stylesheet" href="css/style.css?v=36">
  <style>
    .go { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #000; cursor: pointer; }
    .go button { font: 800 1.6rem 'Blackwood Gothic', serif; color: var(--gold-hi); background: rgba(20, 6, 9, 0.9); border: 1px solid var(--gold); padding: 16px 30px; cursor: pointer; }
    .again { position: fixed; right: 12px; bottom: 12px; z-index: 90; font: 600 0.95rem 'EB Garamond', serif; color: #8d7a7e; background: rgba(0, 0, 0, 0.4); border: 1px solid #3a2a2e; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body data-phase="end">
  <div class="screen-wrap" id="stage"></div>
  <div class="go" id="go"><button>▶ Pornește finalul (cu sunet)</button></div>
  <button class="again" id="again" hidden>↻ Revezi</button>
  <script type="module">
    // Exact ce face proiectorul când câștigă Răul: imaginea (js/bloodmoon.js), sunetul victoriei,
    // apoi, după râsul Contelui (14 secunde), melodia balului din finalul jocului.
    import { bloodMoon, clearBloodMoon } from './js/bloodmoon.js';
    import * as sfx from './js/sfx.js';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Titlu gotic de sânge, cu picături care se scurg (poziții stabile pentru același text).
    function bt(text, emoji = '', { gold = false } = {}) {
      // Valori pseudo-aleatorii bine amestecate, stabile pentru același text.
      const rnd = (k) => {
        let h = 2166136261 ^ Math.imul(k + 1, 2654435761);
        for (const c of text) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      };
      // Picăturile sunt împrăștiate pe tot cuvântul: câte una în fiecare „felie”, la o poziție la întâmplare.
      const n = gold ? 0 : Math.max(3, Math.min(7, Math.round(text.length / 2.2)));
      const drips = Array.from({ length: n }, (_, i) => {
        const left = ((i + 0.15 + rnd(i * 5) * 0.7) / n) * 100;
        const w = 0.05 + rnd(i * 5 + 1) * 0.09;
        const len = 0.15 + rnd(i * 5 + 2) ** 1.6 * 0.95;
        const dur = 2.5 + rnd(i * 5 + 3) * 4;
        const delay = 0.2 + rnd(i * 5 + 4) * 3;
        return `<i class="bt-drip" style="left:${left.toFixed(1)}%;--w:${w.toFixed(3)}em;--len:${len.toFixed(2)}em;--d:${dur.toFixed(1)}s;--delay:${delay.toFixed(1)}s"></i>`;
      }).join('');
      return `${emoji ? `<span class="emo">${emoji}</span> ` : ''}<span class="blood-text ${gold ? 'gold' : ''}">${esc(text)}${drips}</span>`;
    }

    const stage = document.getElementById('stage');
    let musicTimer = null;
    function run() {
      clearBloodMoon();
      sfx.playMusic(null);
      clearTimeout(musicTimer);
      stage.innerHTML = `<div class="end evil"><h1>${bt('Răul a învins', '🩸')}</h1><p class="lead">Castelul Bran aparține acum Contelui.</p></div>`;
      bloodMoon();
      sfx.evilWins();
      musicTimer = setTimeout(() => sfx.playMusic('ball', { fallback: 'doom' }), 14000);
    }
    document.getElementById('go').addEventListener('click', () => {
      sfx.unlock();
      document.getElementById('go').remove();
      document.getElementById('again').hidden = false;
      setTimeout(run, 300);
    });
    document.getElementById('again').addEventListener('click', run);
  </script>
</body>
</html>
