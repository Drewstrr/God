<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0709">
  <meta name="robots" content="noindex">
  <title>Balul Contelui</title>
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body>
  <main class="wrap" id="app">
    <p class="center muted">Se deschid porțile castelului…</p>
  </main>
  <!-- Jos: Pergamentul, Personajele, Regulile. Fiecare deschide foaia de pergament la pagina lui. -->
  <nav class="dock" id="dock" hidden>
    <button class="scroll-btn" data-open="mine"><span class="ico">📜</span>Pergamentul<span class="dot" id="dot" hidden></span></button>
    <button class="scroll-btn" data-open="roles"><span class="ico">📖</span>Personajele</button>
    <button class="scroll-btn" data-open="rules"><span class="ico">⚖️</span>Regulile</button>
  </nav>
  <div class="parchment-veil" id="veil"></div>
  <article class="parchment" id="sheet"></article>

  <script type="module">
    import {
      auth, r, currentUser, signInAnonymously, signOut, onValue, set, update, serverNow, reconnectOnWake, onConnection, APP_VERSION, reloadForVersion,
    } from './js/fb.js';
    import { ROLES, gen, finalDayWarning } from './js/engine.js';
    import { sealSVG } from './js/seal.js';
    import { INTRO } from './js/intro.js';

    reconnectOnWake();
    const net = document.createElement('div');
    net.className = 'net-warning';
    net.textContent = '⚠️ Fără legătură… se reconectează';
    net.hidden = true;
    document.body.appendChild(net);
    let everConnected = false;
    onConnection((on) => { if (on) everConnected = true; net.hidden = on || !everConnected; });

    const app = document.getElementById('app');
    const STORE_KEY = 'botc-player';
    let players = {};
    let engineOnline = false;
    let me = null;          // id-ul jucătorului logat
    let uid = null;
    let pendingNonce = null;
    let pendingPlayer = null;
    let stopPrivate = null;

    const remember = (id) => { try { id ? localStorage.setItem(STORE_KEY, id) : localStorage.removeItem(STORE_KEY); } catch {} };
    const remembered = () => { try { return localStorage.getItem(STORE_KEY); } catch { return null; } };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- ecranul 1: alege-ți numele ----------
    function showNames() {
      me = null;
      const list = Object.entries(players);
      app.innerHTML = `
        <h1 class="center"><span class="blood-text">Balul Contelui</span></h1>
        <p class="center muted">Atinge-ți numele</p>
        ${engineOnline ? '' : '<p class="center error">⏳ Porțile castelului încă sunt închise. Așteaptă puțin.</p>'}
        <div class="names">
          ${list.map(([id, p]) => `<button data-id="${id}">${esc(p.name)}<small>${p.hasPin ? 'are PIN' : 'nou'}</small></button>`).join('')}
        </div>`;
      app.querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', () => showPin(b.dataset.id)));
    }

    // ---------- ecranul 2: PIN ----------
    function showPin(id, { confirmFor = null, message = '' } = {}) {
      const p = players[id];
      const choosing = !p.hasPin;
      const heading = confirmFor ? 'Mai scrie o dată PIN-ul' : choosing ? 'Alege-ți un PIN de 4 cifre' : 'Introdu PIN-ul tău';
      let pin = '';
      app.innerHTML = `
        <h1 class="center">${esc(p.name)}</h1>
        <p class="center">${heading}</p>
        ${choosing && !confirmFor ? '<p class="center muted">Ține-l minte! Îți trebuie dacă intri de pe alt telefon.</p>' : ''}
        <div class="pin-dots">${'<span></span>'.repeat(4)}</div>
        <p class="center error" id="msg">${esc(message)}</p>
        <div class="keypad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}
          <button data-k="back" aria-label="Șterge">⌫</button><button data-k="0">0</button><button data-k="cancel" aria-label="Înapoi">✕</button>
        </div>`;
      const dots = app.querySelectorAll('.pin-dots span');
      const draw = () => dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
      app.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => {
        const k = b.dataset.k;
        if (k === 'cancel') return showNames();
        if (k === 'back') { pin = pin.slice(0, -1); return draw(); }
        if (pin.length >= 4) return;
        pin += k;
        draw();
        if (pin.length < 4) return;
        if (choosing && !confirmFor) return setTimeout(() => showPin(id, { confirmFor: pin }), 150);
        if (choosing && confirmFor !== pin) return setTimeout(() => showPin(id, { message: 'PIN-urile nu se potrivesc. Mai încearcă.' }), 150);
        sendPin(id, pin, choosing ? 'set' : 'login');
      }));
    }

    async function sendPin(id, pin, mode) {
      if (!engineOnline) {
        return showPin(id, { message: 'Porțile castelului încă sunt închise. Mai încearcă puțin mai târziu.' });
      }
      app.innerHTML = '<p class="center muted" style="margin-top:40vh">🕯️ Se verifică…</p>';
      pendingNonce = Math.random().toString(36).slice(2);
      pendingPlayer = id;
      try {
        await set(r(`pinRequests/${uid}`), { player: id, pin, mode, nonce: pendingNonce });
      } catch {
        pendingNonce = null;
        showPin(id, { message: 'Nu s-a putut trimite. Verifică internetul.' });
      }
      setTimeout(() => {
        if (pendingNonce) { pendingNonce = null; showPin(id, { message: 'Castelul nu răspunde. Mai încearcă.' }); }
      }, 12000);
    }

    // ---------- ecranul 3: jocul ----------
    let pub = {};
    let priv = null;
    let lastSig = '';
    let lastWake = null;
    let guideOpen = false;
    let tipsOpen = false;
    let chosen = [];
    let panel = null;   // ce listă e deschisă ziua: 'nominate' | 'slay' | null
    let draftTestament = null;
    const TYPE_LABEL = { townsfolk: 'Sătean', outsider: 'Străin', minion: 'Slujitor', demon: 'Conte' };
    const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(`botc-${k}`); localStorage.setItem(`botc-${k}`, v); } catch { return null; } return null; };
    const sentKey = (night) => `night-${me}-${pub.gameId}-${night}-${pub.nightSeq ?? 0}`;
    const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
    const playerName = (id) => players[id]?.name ?? id;
    // Fără iconițele personajelor (🔮, ⚰️…) la începutul informațiilor: cine se uită peste umăr n-ar trebui să-ți ghicească rolul.
    const plain = (t) => String(t ?? '').replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u, '');

    // ---------- pergamentul (Pergamentul / Personajele / Regulile) ----------
    let sheetTab = 'mine';
    const sheetEl = () => document.getElementById('sheet');
    const sheetOpen = () => sheetEl().classList.contains('open');
    function showDock(on) {
      const dock = document.getElementById('dock');
      dock.hidden = !on;
      if (!on) { closeSheet(); app.classList.remove('with-dock'); return; }
    }
    function markDock() {
      document.querySelectorAll('#dock [data-open]').forEach((b) => b.classList.toggle('on', sheetOpen() && b.dataset.open === sheetTab));
    }
    function openSheet(tab) {
      sheetTab = tab;
      fillSheet();
      sheetEl().scrollTop = 0;
      document.documentElement.classList.add('sheet-open');
      document.getElementById('veil').classList.add('open');
      sheetEl().classList.add('open');
      markDock();
      navigator.vibrate?.(15);
    }
    function closeSheet() {
      if (!sheetOpen()) return;
      document.documentElement.classList.remove('sheet-open');
      document.getElementById('veil').classList.remove('open');
      sheetEl().classList.remove('open');
      markDock();
    }
    // Dacă foaia e deschisă și s-a schimbat ceva (o informație nouă), o rescriem, dar nu cât scrie cineva testamentul.
    function refreshSheet() {
      if (sheetOpen() && document.activeElement?.id !== 'f-testament') { const y = sheetEl().scrollTop; fillSheet(); sheetEl().scrollTop = y; }
    }
    function fillSheet() {
      const el = sheetEl();
      if (sheetTab === 'roles') el.innerHTML = sheetRoles();
      else if (sheetTab === 'rules') el.innerHTML = sheetRules();
      else el.innerHTML = sheetMine();
      wireSheet();
    }
    function sheetMine() {
      const tips = tipsFor();
      return `
        <div class="seal-top">C</div>
        <h2>Rolul tău</h2>
        <p style="text-align:center"><b style="font-size:1.25rem">${esc(priv?.roleName ?? '')}</b><br><span class="muted">${TYPE_LABEL[priv?.type] ?? ''} · ${priv?.team === 'evil' ? 'Tabăra răului' : 'Tabăra binelui'}</span></p>
        <p>${esc(priv?.card ?? '')}</p>
        ${tips ? `<h2>${tips.title}</h2>
          ${tips.list.length ? `<p class="tips-for">Pentru ${esc(priv.roleName)}</p><ol class="tips">${tips.list.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}
          ${tips.common ? `<details class="tips-more"><summary>Pentru toți cei buni (${tips.common.length})</summary><ol class="tips">${tips.common.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></details>` : ''}
          ${tips.poison ? `<details class="tips-more"><summary>☠️ Ce înseamnă otrăvit sau Bețiv?</summary>
            <p><b>Otrăvit:</b> Vrăjitoarea alege în fiecare noapte pe cineva. Până în noaptea următoare, puterea lui nu merge, iar informația primită poate fi falsă. Nu afli că ai fost otrăvit.</p>
            <p><b>Bețiv:</b> un Străin care crede că e Sătean. Puterea lui nu merge deloc, iar informațiile lui pot fi false tot jocul. Nici el nu știe.</p>
            <p>De aceea nicio informație nu e 100% sigură. Când ceva nu se potrivește, poate cineva a fost otrăvit sau e Bețivul.</p></details>` : ''}` : ''}
        ${alive() && pub.phase !== 'end' ? `
          <h2>Testamentul tău</h2>
          <p class="muted">Apare pe proiector dacă mori. Poți scrie ce rol pretinzi, pe cine bănuiești… sau o minciună.</p>
          <textarea id="f-testament" maxlength="200" placeholder="Ultimele tale cuvinte…"></textarea>
          <button class="pbtn" id="save-testament">Salvează</button><span id="testament-ok" class="ok"></span>` : ''}
        ${!alive() ? '<p class="muted" style="margin-top:18px">Ești fantomă: poți vorbi în continuare, dar nu mai ai abilitate și ai un singur vot pentru tot restul jocului.</p>' : ''}
        <button class="pbtn quiet" id="logout">Nu sunt eu (deloghează-mă)</button>
        <p class="close-hint">Atinge foaia ca s-o închizi</p>`;
    }
    function sheetRoles() {
      const n = (k, one, many) => `${k ?? 0} ${k === 1 ? one : many}`;
      const sc = pub.script ?? Object.fromEntries(Object.keys(TYPE_LABEL).map((t) => [t, Object.keys(ROLES).filter((k) => ROLES[k].type === t)]));
      const c = pub.counts;
      const order = [['townsfolk', 'Sătenii'], ['outsider', 'Străinii'], ['minion', 'Slujitorii'], ['demon', 'Contele']];
      return `
        <h2>Personajele posibile</h2>
        <p class="muted">${c ? `În joc sunt: ${n(c.townsfolk, 'Sătean', 'Săteni')}, ${n(c.outsider, 'Străin', 'Străini')}, ${n(c.minion, 'Slujitor', 'Slujitori')} și 1 Conte. ` : ''}Restul personajelor de pe listă nu sunt în joc, dar oricine poate pretinde că le are.</p>
        ${order.map(([t, title]) => {
          const list = Object.values(sc[t] ?? {});
          const evil = t === 'minion' || t === 'demon';
          return `<details open><summary>${title} (${list.length})</summary>${list.map((k) => `<div class="role-line ${evil ? 'evil' : ''}"><b>${esc(ROLES[k].name)}</b><br><span class="muted">${esc(ROLES[k].card)}</span></div>`).join('')}</details>`;
        }).join('')}
        <p class="close-hint">Atinge foaia ca s-o închizi</p>`;
    }
    function sheetRules() {
      return `
        <h2>Regulamentul pe scurt</h2>
        <ul class="rules-short">
          <li><b>Scopul:</b> Binele câștigă dacă moare Contele. Răul câștigă dacă rămân doar doi în viață sau niciun bun.</li>
          <li><b>Noaptea:</b> toți apasă pe telefon, în liniște. Contele ucide începând cu a doua noapte.</li>
          <li><b>Ziua:</b> timp liber, apoi adunarea. Nominalizezi o singură dată pe zi, din telefon.</li>
          <li><b>Votul:</b> public, pe telefon. Pe butuc ajunge cine are cel puțin jumătate din voturile celor vii și mai multe decât cel aflat deja acolo. La sfârșitul zilei, cel de pe butuc e executat.</li>
          <li><b>Moartea:</b> rolul rămâne secret. Fantomele vorbesc, dar au un singur vot pentru tot jocul.</li>
          <li><b>Minciuni:</b> oricine poate minți. Bețivul și otrăviții primesc informații false fără să știe.</li>
          <li><b>Țărușul:</b> oricine îl poate folosi o dată, la adunare. Ucide doar Contele, și doar dacă îl folosește Van Helsing adevărat.</li>
        </ul>
        <p style="text-align:center"><a href="regulament" target="_blank">📜 Regulamentul complet ›</a></p>
        <p class="close-hint">Atinge foaia ca s-o închizi</p>`;
    }
    function wireSheet() {
      const el = sheetEl();
      el.querySelector('#logout')?.addEventListener('click', () => { if (confirm('Te deloghezi de pe acest telefon?')) { closeSheet(); logout(); } });
      // Testamentul: păstrăm ce scrie jucătorul între redesenări.
      const tEl = el.querySelector('#f-testament');
      if (!tEl) return;
      tEl.value = draftTestament ?? store(`testament-${pub.gameId}-${me}`) ?? '';
      tEl.addEventListener('input', () => { draftTestament = tEl.value; });
      el.querySelector('#save-testament').addEventListener('click', async (e) => {
        const text = tEl.value.trim();
        e.target.disabled = true;
        try {
          await set(r(`playerInput/${me}/testament`), text);
          store(`testament-${pub.gameId}-${me}`, text);
          draftTestament = null;
          el.querySelector('#testament-ok').textContent = '✓ Salvat';
        } catch { el.querySelector('#testament-ok').textContent = 'Nu s-a salvat. Mai încearcă.'; }
        e.target.disabled = false;
      });
    }

    function showHome() {
      stopPrivate?.();
      priv = null;
      lastSig = '';
      renderGame(true);
      stopPrivate = onValue(r(`private/${me}`), (snap) => { priv = snap.val(); renderGame(); }, () => {
        priv = null;
        app.innerHTML = '<p class="center error">Legătura secretă nu e activă. Apasă „Nu sunt eu” și loghează-te din nou.</p><button class="btn ghost" id="logout">Nu sunt eu</button>';
        app.querySelector('#logout').addEventListener('click', logout);
      });
    }

    const alive = () => priv?.status?.alive !== false;
    const sealed = () => !store(`seal-${pub.gameId}-${me}`);
    const canVoteNow = () => alive() || priv?.status?.ghostVote;

    function renderGame(force = false) {
      if (!me) return;
      const phase = pub.phase ?? 'lobby';
      const night = phase === 'night' && priv?.night?.night === pub.round ? priv.night : null;
      const cur = pub.day?.current;
      const sig = JSON.stringify([phase, pub.round, pub.winner, priv, Boolean(night), pub.nightSeq, cur?.key, cur?.stage, pub.day?.nominated, pub.day?.nominators, pub.day?.free, pub.day?.freeOver, pub.endStage, Boolean(pub.script), panel, Boolean(pub.paused), pub.morning?.dawnAt, pub.introAt]);
      if (!force && sig === lastSig) return;
      lastSig = sig;
      guideOpen = document.querySelector('details.guide:not(.evil-tips)')?.open ?? guideOpen;
      tipsOpen = document.querySelector('details.evil-tips')?.open ?? tipsOpen;
      document.body.classList.toggle('dark-night', Boolean(night));
      // Telefonul se „trezește” singur noaptea, la vot și când Corbierul are de ales.
      const gathering = pub.phase === 'day' && !pub.day?.free ? `g${pub.day?.day}` : null;
      const wake = night ? `n${pub.round}` : cur?.stage === 'voting' ? `v${cur.key}` : priv?.raven ? 'raven' : gathering;
      if (wake) {
        document.querySelector('.curtain')?.remove();
        // Jocul îți cere ceva: pergamentul se închide singur, ca acțiunea să fie imediat sub deget.
        if (wake !== lastWake) { navigator.vibrate?.(300); closeSheet(); }
      }
      lastWake = wake;
      if (night) { showDock(false); return renderNight(night); }
      if (dawnActive()) { showDock(false); return renderDawn(); }
      if (filmActive()) { showDock(false); return renderFilmWait(); }
      renderMain(phase);
      refreshSheet();
      const guide = document.querySelector('details.guide:not(.evil-tips)');
      if (guide) guide.open = guideOpen;
      const tips = document.querySelector('details.evil-tips');
      if (tips) tips.open = tipsOpen;
    }

    // Votul public: DA / NU. Fantomele mai au un singur vot pentru tot jocul.
    function voteCard() {
      const c = pub.day?.current;
      if (pub.phase !== 'day' || c?.stage !== 'voting') return '';
      if (!canVoteNow()) return `<div class="card center"><h2>✠ Se votează</h2><p class="muted">Ți-ai folosit votul de fantomă.</p></div>`;
      const mine = store(`vote-${pub.gameId}-${c.key}`);
      if (mine) return `<div class="card center vote-card"><h2>✠ Ai votat: ${mine === 'yes' ? 'DA' : 'NU'}</h2><p class="muted">Poți schimba până se termină timpul.</p>
        <div class="row2"><button class="btn ${mine === 'yes' ? '' : 'ghost'}" data-vote="yes">DA</button><button class="btn ${mine === 'no' ? '' : 'ghost'}" data-vote="no">NU</button></div></div>`;
      return `<div class="card center vote-card calling">
          <h2>✠ Votezi ca ${esc(c.targetName)} să fie ${gen(c.target, 'executat', 'executată')}?</h2>
          ${alive() ? '' : '<p class="error">👻 E votul tău de fantomă: dacă votezi DA, nu mai poți vota niciodată.</p>'}
          <p class="muted">Rămân <b data-ends="${c.endsAt ?? ''}"></b> · votul se vede pe proiector</p>
          <div class="row2"><button class="btn ghost" data-vote="yes">✠ DA</button><button class="btn ghost" data-vote="no">NU</button></div>
        </div>`;
    }

    // Nominalizarea și țărușul (ziua).
    function dayActions() {
      const d = pub.day ?? {};
      if (pub.phase !== 'day' || !alive()) return '';
      if (d.free && d.freeOver) {
        if (!store(`freeover-${pub.gameId}-${d.day}`)) { store(`freeover-${pub.gameId}-${d.day}`, '1'); navigator.vibrate?.([300, 150, 300]); }
        return '<div class="card center doom-card final"><b>🔔 Timpul liber s-a terminat!</b><p>Vino la masă: adunarea începe când sunt toți acolo.</p></div>';
      }
      if (d.free) return `<div class="card center"><p>🎭 <b>Timp liber.</b> Adunarea în <b data-ends="${d.free}"></b>.</p><p class="muted">Nominalizările și țărușul se deschid la adunare. Până atunci: vorbește, ascultă, minte.</p></div>`;
      if (pub.paused) return '';
      const busy = Boolean(d.current);
      const nominatedToday = (d.nominators ?? []).includes(me);
      const others = Object.keys(players).filter((id) => id in (pub.alive ?? {}));
      let html = '';
      if (panel === 'nominate') {
        const free = others.filter((id) => id !== me && !(d.nominated ?? []).includes(id) && pub.alive?.[id] !== false);
        html += `<div class="card"><h3>⚖︎ Pe cine nominalizezi?</h3><p class="muted">Poți nominaliza o singură dată pe zi. Fiecare poate fi nominalizat o dată pe zi.</p>
          <div class="targets">${free.map((id) => `<button data-nom="${id}">${esc(playerName(id))}</button>`).join('')}</div>
          <button class="btn ghost" data-panel="">Renunță</button></div>`;
      } else if (panel === 'slay') {
        html += `<div class="card"><h3>🗡️ În cine înfigi țărușul?</h3><p class="muted">Se anunță pe proiector, în fața tuturor. Ai voie o singură dată în tot jocul. Țărușul îl ucide doar pe Conte și doar dacă îl folosește Van Helsing adevărat; pentru ceilalți nu se întâmplă nimic.</p>
          <div class="targets">${others.filter((id) => id !== me && pub.alive?.[id] !== false).map((id) => `<button data-slay="${id}">${esc(playerName(id))}</button>`).join('')}</div>
          <button class="btn ghost" data-panel="">Renunță</button></div>`;
      } else {
        // La deschiderea adunării cardul pulsează până când atingi ceva în el.
        const calling = !nominatedToday && !busy && !store(`gath-${pub.gameId}-${d.day}-${me}`);
        html += `<div class="card day-actions${calling ? ' calling' : ''}">
          ${nominatedToday ? '<p class="muted center">⚖︎ Ai nominalizat deja azi.</p>'
            : busy ? '<p class="muted center">⏳ O nominalizare e în curs. Așteaptă să se termine.</p>'
            : `<p class="center"><b>⚖︎ Bănuiești pe cineva?</b><br><span class="muted">Acuză-l în fața tuturor: urmează apărarea și votul.</span></p>
               <button class="btn" data-panel="nominate">⚖︎ Nominalizează pe cineva</button>`}
          ${priv?.slayUsed ? '' : '<button class="btn ghost small" data-panel="slay" style="margin-top:10px">🗡️ Țărușul lui Van Helsing</button>'}
        </div>`;
      }
      return html;
    }

    // Dimineața: telefonul urmează ritualul de pe proiector. Lumânarea ta se aprinde = „te-ai trezit” (vibrează);
    // dacă ai murit noaptea, afli în aceeași clipă cu toată sala, când rămâne doar lumânarea ta stinsă.
    let dawnTimer = null;
    let dawnShown = '';
    const dawnActive = () => pub.phase === 'morning' && pub.morning?.dawnAt && serverNow() < pub.morning.dawnAt + pub.morning.end * 1000 && priv?.role && !priv?.sitOut;
    function renderDawn() {
      const m = pub.morning;
      const t = (serverNow() - m.dawnAt) / 1000;
      const died = (m.deaths ?? []).some((d) => d.id === me);
      const wakeAt = m.wake?.[me];
      const wasGhost = !died && wakeAt === undefined;
      let state = 'waiting';
      if (wasGhost) state = 'ghost';
      else if (died && t >= m.act3) state = 'dead';
      else if (!died && t >= wakeAt) state = 'awake';
      if (state !== dawnShown) {
        if (state === 'awake') navigator.vibrate?.(180);
        if (state === 'dead') navigator.vibrate?.([400, 200, 900]);
      }
      dawnShown = state;
      const html = {
        waiting: '<div class="dawn-phone"><div class="dp-icon">🌅</div><p>Castelul se trezește…</p><p class="muted">Uită-te la proiector.</p></div>',
        awake: '<div class="dawn-phone awake"><div class="dp-icon">🕯️</div><p><b>Te-ai trezit.</b></p><p class="muted">Lumânarea ta arde mai departe.</p></div>',
        dead: '<div class="dawn-phone dead"><div class="dp-icon">🕯</div><p><b>Nu te-ai mai trezit…</b></p><p class="muted">Contele a venit la tine în noaptea asta. Ești fantomă: poți vorbi în continuare, dar ai un singur vot pentru tot restul jocului.</p></div>',
        ghost: '<div class="dawn-phone dead"><div class="dp-icon">👻</div><p>Privești de dincolo cum se trezește castelul…</p></div>',
      }[state];
      document.body.classList.toggle('dark-night', state !== 'awake');
      document.querySelector('.curtain')?.remove();   // perdeaua nu are voie să acopere ritualul
      app.innerHTML = html;
      // Următorul moment important: când mi se aprinde lumânarea, deznodământul sau sfârșitul ritualului.
      clearTimeout(dawnTimer);
      const next = [wakeAt, m.act3, m.end].filter((x) => x !== undefined && x > t).sort((a, b) => a - b)[0];
      if (next !== undefined) dawnTimer = setTimeout(() => renderGame(true), (next - t) * 1000 + 80);
    }

    // Corbierul ucis noaptea alege pe cineva.
    function ravenCard() {
      const rv = priv?.raven;
      if (!rv) return '';
      return `<div class="card center calling"><h2>🪶 Corbii tăi zboară o ultimă dată</h2><p>Alege un jucător și îi vei afla rolul.</p>

        </div>`;

      const gustIn = pub.introAt + INTRO.gust * 1000 - serverNow();
      if (gustIn > 0) filmTimers.push(setTimeout(() => navigator.vibrate?.([60, 80, 60]), gustIn));

    function finalCards(phase) {
      const f = pub.final;
      const st = pub.endStage ?? 'winner';
      if (phase !== 'end' || !f || st === 'winner') return '';
      const roles = `<div class="card"><h3>🎭 Cine ce a fost</h3>${(f.roles ?? []).map((x) => `<p>${x.emoji} <b>${esc(x.name)}</b> — ${esc(x.roleName)}${x.drunkAs ? ` (credea că e ${esc(x.drunkAs)})` : ''}${x.alive ? '' : ' 💀'}</p>`).join('')}</div>`;
      const titles = st === 'titles' && f.titles?.length
        ? `<div class="card"><h3>🏅 Titlurile serii</h3>${f.titles.map((t) => `<p>${t.emoji} <b>${esc(t.title)}</b>: ${t.names.map(esc).join(', ')}</p>`).join('')}</div>`
        : '';
      return roles + titles;
    }

    // Lista personajelor POSIBILE: nu toate sunt în joc (unele lipsesc mereu, de aici vin minciunile).
    function scriptGuide() {
      // Înainte de start (lobby) arătăm toată lista, fără numărul exact din joc.
      const sc = pub.script ?? Object.fromEntries(['demon', 'minion', 'townsfolk', 'outsider'].map((t) => [t, Object.keys(ROLES).filter((k) => ROLES[k].type === t)]));
      const c = pub.counts ?? {};
      const known = Boolean(pub.counts);
      const order = [['demon', '🧛 Contele'], ['minion', '🦇 Slujitorii'], ['townsfolk', '🕯️ Sătenii'], ['outsider', '🍷 Străinii']];
      return `
        <details class="card guide">
          <summary>📖 Personajele posibile</summary>
          <p class="muted">${known ? `În joc sunt: ${c.townsfolk ?? 0} Săteni, ${c.outsider ?? 0} Străini, ${c.minion ?? 0} Slujitori și 1 Conte.` : 'Câte personaje din fiecare fel intră în joc se anunță la start.'} Restul personajelor de pe listă <b>nu</b> sunt în joc, dar oricine poate pretinde că le are.</p>
          ${order.map(([t, title]) => {
            const list = Object.values(sc[t] ?? {});
            const evil = t === 'demon' || t === 'minion';
            return `<div class="guide-team ${evil ? 'evil' : 'good'}"><h3>${title}${t !== 'demon' && known ? ` (${c[t] ?? 0} în joc din ${list.length})` : ''}</h3>${list.map((k) => `
              <div class="guide-role ${evil ? 'evil' : 'good'}"><b>${ROLES[k].emoji} ${esc(ROLES[k].name)}</b><p>${esc(ROLES[k].card)}</p></div>`).join('')}</div>`;
          }).join('')}
        </details>`;
    }

    // Noaptea: 1) abilitatea (dacă ai una de ales), 2) pariul nopții — pentru toată lumea, ca ecranele să arate la fel.
    function renderNight(night) {
      const n = night.night;
      const step = store(sentKey(n));
      const timer = `<p class="center muted">⏳ <b data-ends="${pub.endsAt ?? ''}"></b></p>`;
      const fail = (btn) => { if (btn) btn.disabled = false; const m = document.getElementById('msg'); if (m) m.textContent = 'Nu s-a trimis. Noaptea s-a încheiat sau nu ai internet.'; };

      if (step === 'done') {
        app.innerHTML = `
          <h2 class="center" style="margin-top:18vh">🌑 Noaptea ${n}</h2>
          <p class="center">✓ Gata. Alegerile tale au fost trimise.</p>
          ${night.info ? '<p class="center muted">Informația ta vine dimineața, aici pe telefon.</p>' : ''}
          <p class="center muted">Lasă telefonul jos și așteaptă dimineața.</p>
          ${timer}`;
        return;
      }

      if (step || !night.pick) {
        chosen = [];
        app.innerHTML = `
          <h2 class="center">🌑 Noaptea ${n}</h2>
          ${timer}
          ${night.ghost ? '<p class="center muted">👻 Ești fantomă: nu mai ai abilitate, dar poți paria.</p>' : ''}
          <p class="center" style="font-size:1.25rem"><b>🎲 Pariul nopții: cine crezi că e Contele?</b></p>
          <p class="center muted" style="margin-top:-6px">🦅 Secret. La final, cine l-a ghicit cel mai des primește titlul „Ochiul de vultur”.</p>
          <div class="targets calling">${(night.bets ?? []).map((t) => `<button data-t="${t.id}">${esc(t.name)}</button>`).join('')}</div>
          <p class="center error" id="msg"></p>
          <button class="btn" id="confirm" disabled>Pariază</button>
          <button class="btn ghost" id="skip" style="margin-top:10px">Nu știu</button>`;
        const finish = async (bet, btn) => {
          if (btn) btn.disabled = true;
          try {
            await update(r(`actions/${n}/${me}`), { bet, done: true, at: Date.now() });
            store(sentKey(n), 'done');
            renderGame(true);
          } catch { fail(btn); }
        };
        app.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
          chosen = [b.dataset.t];
          app.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('chosen', x === b));
          document.getElementById('confirm').disabled = false;
        }));
        app.querySelector('#confirm').addEventListener('click', (e) => chosen.length && finish(chosen[0], e.target));
        app.querySelector('#skip').addEventListener('click', (e) => finish(null, e.target));
        return;
      }

      // Pasul 1: abilitatea (1 sau 2 jucători).
      chosen = [];
      app.innerHTML = `
        <h2 class="center">🌑 Noaptea ${n}</h2>
        ${timer}
        <p class="center" style="font-size:1.25rem"><b>${esc(night.prompt)}</b></p>
        ${night.pick > 1 ? `<p class="center muted">Alege ${night.pick} jucători.</p>` : ''}
        <div class="targets calling">${(night.targets ?? []).map((t) => `<button data-t="${t.id}">${esc(t.name)}${pub.alive?.[t.id] === false ? ' 👻' : ''}</button>`).join('')}</div>
        <p class="center error" id="msg"></p>
        <button class="btn" id="confirm" disabled>Confirmă</button>`;
      app.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
        const id = b.dataset.t;
        if (chosen.includes(id)) chosen = chosen.filter((x) => x !== id);
        else chosen = [...chosen, id].slice(-night.pick);
        app.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('chosen', chosen.includes(x.dataset.t)));
        document.getElementById('confirm').disabled = chosen.length !== night.pick;
      }));
      app.querySelector('#confirm').addEventListener('click', async (e) => {
        if (chosen.length !== night.pick) return;
        e.target.disabled = true;
        try {
          await set(r(`actions/${n}/${me}`), { targets: chosen, at: Date.now() });
          store(sentKey(n), 'step1');
          renderGame(true);
        } catch { fail(e.target); }
      });
    }

    // Butoanele de jos: deschid foaia la pagina lor; apăsat din nou, butonul paginii deschise o închide.
    document.querySelectorAll('#dock [data-open]').forEach((b) => b.addEventListener('click', () => {
      if (sheetOpen() && sheetTab === b.dataset.open) return closeSheet();
      if (sheetOpen()) { sheetTab = b.dataset.open; fillSheet(); sheetEl().scrollTop = 0; markDock(); }
      else openSheet(b.dataset.open);
    }));
    document.getElementById('veil').addEventListener('click', closeSheet);
    // O atingere pe foaie o închide (nu și pe butoane, linkuri, câmpuri sau titlurile grupelor).
    sheetEl().addEventListener('click', (e) => { if (!e.target.closest('button, textarea, input, a, summary')) closeSheet(); });

    // Ecranul se întunecă singur după 40 de secunde fără atingere.
    let idle = null;
    function curtain() {
      if (document.querySelector('.curtain')) return;
      const c = document.createElement('div');
      c.className = 'curtain';
      c.textContent = 'Atinge ecranul';
      c.addEventListener('click', () => c.remove());
      document.body.appendChild(c);
    }
    const resetIdle = () => {
      clearTimeout(idle);
      idle = setTimeout(() => { if (me && !['night', 'lobby'].includes(pub.phase) && pub.day?.current?.stage !== 'voting' && !dawnActive()) curtain(); }, 40000);
    };
    ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, resetIdle));
    resetIdle();
    setInterval(() => {
      document.querySelectorAll('[data-ends]').forEach((el) => { if (+el.dataset.ends) el.textContent = fmt(+el.dataset.ends - (pub.paused?.at ?? serverNow())); });
    }, 500);

    async function logout() {
      stopPrivate?.(); stopPrivate = null;
      remember(null);
      me = null;
      // Un cont anonim nou, ca dispozitivul să nu mai fie legat de jucătorul vechi.
      await signOut(auth);
      await start();
    }

    // ---------- pornire ----------
    let started = false;
    async function start() {
      let user = await currentUser();
      if (!user || !user.isAnonymous) user = (await signInAnonymously(auth)).user;
      uid = user.uid;

      onValue(r(`pinStatus/${uid}`), (snap) => {
        const s = snap.val();
        if (!s) return;
        if (s.reset) { stopPrivate?.(); stopPrivate = null; remember(null); if (me) { me = null; showNames(); } return; }
        if (pendingNonce && s.nonce === pendingNonce) {
          const tried = pendingPlayer;
          pendingNonce = null;
          if (s.ok) { me = s.player; remember(me); showHome(); }
          else showPin(tried, { message: s.error });
          return;
        }
        if (!pendingNonce && s.ok && s.player && !me) { me = s.player; remember(me); showHome(); }
      });

      if (started) return showNames();
      started = true;
      onValue(r('public'), (snap) => {
        pub = snap.val() ?? {};
        // Codul s-a actualizat pe site: ne reîncărcăm (dar nu în mijlocul nopții).
        if (pub.appVersion > APP_VERSION && pub.phase !== 'night' && reloadForVersion(pub.appVersion)) return;
        if (me) renderGame();
      }, (err) => console.error(err));
      onValue(r('public/engine'), (snap) => {
        engineOnline = Boolean(snap.val()?.online);
        if (!me && !pendingNonce && app.querySelector('.names')) showNames();
      }, (err) => console.error(err));
      onValue(r('public/players'), (snap) => {
        players = snap.val() ?? {};
        if (!Object.keys(players).length) {
          app.innerHTML = '<h1 class="center"><span class="blood-text">Balul Contelui</span></h1><p class="center muted">⏳ Porțile castelului încă sunt închise. Pagina se actualizează singură când se deschid.</p>';
          return;
        }
        if (!me && !pendingNonce && !app.querySelector('.keypad')) showNames();
      }, (err) => {
        console.error(err);
        app.innerHTML = '<h1 class="center"><span class="blood-text">Balul Contelui</span></h1><p class="center error">🔒 Castelul e încuiat: baza de date refuză accesul (regulile Firebase nu sunt publicate).</p>';
      });
    }

    start().catch((e) => {
      console.error(e);
      app.innerHTML = '<p class="center error">Nu mă pot conecta. Verifică internetul și reîncarcă pagina.</p>';
    });
  </script>
</body>
</html>
