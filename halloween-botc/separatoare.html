<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Separatoare</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0a0507; }
    .wrap { max-width: 760px; }
    .opt { border: 1px solid var(--gold-dim); background: rgba(20, 6, 9, 0.7); padding: 18px 16px 22px; margin: 18px 0; text-align: center; }
    .opt h2 { margin: 0 0 4px; font-size: 1.3rem; }
    .opt .what { color: var(--muted); font-style: italic; margin: 0 0 16px; font-family: 'EB Garamond', serif; }
    .big svg { width: min(100%, 460px); height: auto; display: block; margin: 0 auto; }
    .demo { margin-top: 18px; font-family: 'EB Garamond', serif; }
    .demo .tag { color: #c9b8a6; font-style: italic; font-size: 1.15rem; }
    .demo .small svg { width: 260px; height: auto; display: block; margin: 6px auto; }
    .demo .lbl { color: var(--gold); letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.8rem; }
    .demo .card-h { font: 800 1.4rem 'Blackwood Gothic', serif; color: var(--gold-hi); margin-top: 18px; }
    .demo .tiny svg { width: 170px; height: auto; display: block; margin: 2px auto 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="center">Separatoare regale</h1>
    <p class="center muted">Fiecare variantă e arătată mare, apoi cum ar arăta în teaser (sub „O noapte. Un Conte. Nicio încredere.”) și sub un titlu din panou.</p>
    <div id="list"></div>
  </main>
  <script>
    // Paleta: aur (deschis, mediu, închis) și rubin.
    const defs = `<defs>
      <linearGradient id="au" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a8"/><stop offset=".5" stop-color="#c9a14a"/><stop offset="1" stop-color="#7c5a1e"/></linearGradient>
      <linearGradient id="auh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a14a" stop-opacity="0"/><stop offset=".25" stop-color="#c9a14a"/><stop offset=".75" stop-color="#c9a14a"/><stop offset="1" stop-color="#c9a14a" stop-opacity="0"/></linearGradient>
      <radialGradient id="ru" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ff8a8a"/><stop offset=".3" stop-color="#d0202f"/><stop offset=".8" stop-color="#6a0710"/><stop offset="1" stop-color="#3a0308"/></radialGradient>
    </defs>`;
    const ruby = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r + 1.1}" fill="url(#au)"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#ru)"/><circle cx="${x - r * 0.35}" cy="${y - r * 0.4}" r="${r * 0.25}" fill="#fff" opacity=".7"/>`;
    const pearl = (x, y, r = 1.4) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#au)"/>`;
    // Oglindește jumătatea stângă în dreapta (axa la x = 200).
    const mirror = (g) => `${g}<g transform="matrix(-1 0 0 1 400 0)">${g}</g>`;

    const options = [
      ['I. Coroana Contelui', 'Coroană de aur cu rubine, volute și perle pe margini.', 48, mirror(`
        <path d="M8 24 H128" stroke="url(#auh)" stroke-width="1.2"/>
        <path d="M40 28 H134" stroke="#8e1023" stroke-width="1"/>
        <path d="M60 20 H136" stroke="#c9a14a" stroke-width=".6" opacity=".7"/>
        ${pearl(30, 24)}${pearl(46, 24, 1)}${pearl(150, 24, 1.6)}
        <path d="M172 24 c-8 0 -14 -6 -12 -12 c1.5 -4 7 -4 7.5 0 c.4 3 -3 4 -4.5 2.5" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M172 24 c-8 0 -14 6 -12 12 c1.5 4 7 4 7.5 0 c.4 -3 -3 -4 -4.5 -2.5" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M136 24 c10 -7 20 -7 28 0 c-8 7 -18 7 -28 0z" fill="#8e1023" stroke="url(#au)" stroke-width="1"/>`) + `
        <path d="M182 32 L180 16 L188 23 L194 11 L200 21 L206 11 L212 23 L220 16 L218 32 Z" fill="url(#au)" stroke="#5a3d10" stroke-width=".6"/>
        <rect x="181" y="31" width="38" height="5" rx="1" fill="url(#au)" stroke="#5a3d10" stroke-width=".6"/>
        ${ruby(200, 33.5, 1.8)}${ruby(190, 33.5, 1.2)}${ruby(210, 33.5, 1.2)}
        ${pearl(180, 15, 1.6)}${pearl(194, 10, 1.6)}${pearl(206, 10, 1.6)}${pearl(220, 15, 1.6)}
        ${ruby(200, 18, 2.6)}
        <path d="M200 6 v-4 M198 4 h4" stroke="url(#au)" stroke-width="1.2"/>`],

      ['II. Ordinul Dragonului', 'Emblema lui Vlad Dracul: dragonul încolăcit în jurul crucii roșii, cu lanț de aur.', 48, mirror(`
        <path d="M6 24 H150" stroke="url(#auh)" stroke-width="1"/>
        ${[30, 50, 70, 90, 110, 130].map((x) => `<ellipse cx="${x}" cy="24" rx="7" ry="3.4" fill="none" stroke="url(#au)" stroke-width="1.4"/>`).join('')}
        ${[40, 80, 120].map((x) => ruby(x, 24, 1.6)).join('')}
        <path d="M150 24 c6 -4 10 -4 14 0 c-4 4 -8 4 -14 0z" fill="url(#au)"/>`) + `
        <circle cx="200" cy="24" r="18" fill="#160709" stroke="url(#au)" stroke-width="2.2"/>
        <circle cx="200" cy="24" r="14.5" fill="none" stroke="#8e1023" stroke-width="1"/>
        <path d="M200 13 v22 M191 22 h18" stroke="url(#ru)" stroke-width="4" stroke-linecap="square"/>
        <path d="M200 13 v22 M191 22 h18" stroke="#ff8a8a" stroke-width=".6" opacity=".6"/>
        <path d="M184 18 c-4 -6 2 -12 8 -10 l-2 3 l4 -1" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M216 30 c4 6 -2 12 -9 9 c-3 -1 -4 -4 -2 -6" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M216 18 l5 -4 l-1 4 l4 -1 l-3 4" fill="url(#au)"/>`],

      ['III. Filigran baroc', 'Volute duble, frunze de acant, rubin central montat în aur și perle.', 44, mirror(`
        <path d="M4 22 H96" stroke="url(#auh)" stroke-width="1"/>
        <path d="M96 22 c10 0 14 -10 24 -10 c8 0 10 8 4 9 c-3 .5 -5 -2 -3 -4" fill="none" stroke="url(#au)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M96 22 c10 0 14 10 24 10 c8 0 10 -8 4 -9 c-3 -.5 -5 2 -3 4" fill="none" stroke="url(#au)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M128 22 c12 0 18 -14 34 -12 c10 1 12 10 4 12 c-4 1 -7 -2 -5 -5" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M128 22 c12 0 18 14 34 12 c10 -1 12 -10 4 -12 c-4 -1 -7 2 -5 5" fill="none" stroke="url(#au)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M120 22 H182" stroke="#8e1023" stroke-width="1"/>
        <path d="M150 22 c4 -5 9 -6 12 -4 c-3 1 -6 3 -12 4z M150 22 c4 5 9 6 12 4 c-3 -1 -6 -3 -12 -4z" fill="url(#au)"/>
        ${pearl(70, 22, 1.2)}${pearl(84, 22, 1.6)}${pearl(112, 22, 1.2)}${pearl(176, 12, 1.2)}${pearl(176, 32, 1.2)}`) + `
        <path d="M200 8 L212 22 L200 36 L188 22 Z" fill="url(#au)"/>
        <path d="M200 12 L208.5 22 L200 32 L191.5 22 Z" fill="url(#ru)"/>
        <path d="M200 12 L204 22 L200 32 M191.5 22 H208.5" stroke="#ff9a9a" stroke-width=".4" opacity=".55" fill="none"/>
        ${pearl(200, 4, 1.6)}${pearl(200, 40, 1.6)}`],

      ['IV. Crinul regal', 'Floare de crin heraldică din aur, flancată de două mai mici, pe benzi de catifea roșie.', 44, mirror(`
        <path d="M6 22 H160" stroke="url(#auh)" stroke-width="1"/>
        <path d="M40 19 H160 M40 25 H160" stroke="#c9a14a" stroke-width=".5" opacity=".6"/>
        <rect x="70" y="20.5" width="90" height="3" fill="#7a0c1e"/>
        <g transform="translate(120 22) scale(.45)">
          <path d="M0 -16 c-6 6 -6 14 0 20 c6 -6 6 -14 0 -20z M-2 4 c-8 -6 -18 -4 -16 4 c1 4 6 4 7 1 c-4 0 -4 -4 0 -4 c3 0 6 2 9 5z M2 4 c8 -6 18 -4 16 4 c-1 4 -6 4 -7 1 c4 0 4 -4 0 -4 c-3 0 -6 2 -9 5z M-8 6 h16 v3 h-16z M-3 9 c0 4 -3 7 -5 8 h16 c-2 -1 -5 -4 -5 -8z" fill="url(#au)"/>
        </g>
        ${ruby(96, 22, 1.4)}${ruby(144, 22, 1.4)}
        <path d="M168 22 l6 -4 l6 4 l-6 4z" fill="url(#au)"/>`) + `
        <g transform="translate(200 21) scale(.95)">
          <path d="M0 -18 c-7 7 -7 16 0 22 c7 -6 7 -15 0 -22z M-2 4 c-9 -7 -20 -5 -18 4 c1 5 7 5 8 1 c-5 0 -5 -5 0 -5 c3 0 7 3 10 6z M2 4 c9 -7 20 -5 18 4 c-1 5 -7 5 -8 1 c5 0 5 -5 0 -5 c-3 0 -7 3 -10 6z M-9 6 h18 v3.5 h-18z M-3 9.5 c0 4 -3 7 -6 8.5 h18 c-3 -1.5 -6 -4.5 -6 -8.5z" fill="url(#au)" stroke="#5a3d10" stroke-width=".4"/>
          <path d="M-9 6 h18 v3.5 h-18z" fill="url(#ru)"/>
        </g>`],

      ['V. Lanțul cu rubine', 'Colan regal: zale de aur alternând cu rubine, pandantiv central cu un rubin mare.', 46, mirror(`
        <path d="M6 22 H40" stroke="url(#auh)" stroke-width="1"/>
        ${[48, 66, 84, 102, 120, 138, 156].map((x, i) => (i % 2
          ? `<rect x="${x - 6}" y="18" width="12" height="8" rx="4" fill="none" stroke="url(#au)" stroke-width="1.4"/>`
          : `<path d="M${x - 6} 22 l6 -5 l6 5 l-6 5z" fill="url(#au)"/>${ruby(x, 22, 1.5)}`)).join('')}
        <path d="M162 22 H176" stroke="url(#au)" stroke-width="1.4"/>`) + `
        <circle cx="200" cy="22" r="15" fill="url(#au)"/>
        <circle cx="200" cy="22" r="12.5" fill="#2a0a0e"/>
        <path d="M200 11 L210 18 L207 30 L193 30 L190 18 Z" fill="url(#ru)" stroke="#ffb0b0" stroke-width=".4" stroke-opacity=".5"/>
        <path d="M200 11 L200 30 M190 18 L210 18 M193 30 L200 18 L207 30" stroke="#ffb0b0" stroke-width=".35" opacity=".45" fill="none"/>
        ${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => pearl(200 + 15.5 * Math.cos(a * Math.PI / 180), 22 + 15.5 * Math.sin(a * Math.PI / 180), 1.4)).join('')}
        <path d="M200 37 l3 5 h-6z" fill="url(#au)"/>`],

      ['VI. Blazonul castelului', 'Scut roșu cu chenar de aur și cruce, între ramuri de lauri și o panglică.', 50, mirror(`
        <path d="M6 25 H140" stroke="url(#auh)" stroke-width="1"/>
        <path d="M60 29 H150" stroke="#8e1023" stroke-width="1.2"/>
        ${pearl(50, 25, 1.2)}${pearl(66, 25, 1.6)}
        <path d="M182 34 c-14 -2 -24 -10 -30 -20" fill="none" stroke="url(#au)" stroke-width="1.2"/>
        ${[[176, 32, -30], [168, 28, -40], [161, 23, -50], [156, 18, -60]].map(([x, y, a]) => `<ellipse cx="${x}" cy="${y}" rx="4.6" ry="1.8" transform="rotate(${a} ${x} ${y})" fill="url(#au)"/><ellipse cx="${x + 3}" cy="${y - 4}" rx="4.2" ry="1.6" transform="rotate(${a + 70} ${x + 3} ${y - 4})" fill="url(#au)"/>`).join('')}
        ${ruby(153, 13, 1.3)}`) + `
        <path d="M186 8 H214 V24 C214 34 206 40 200 44 C194 40 186 34 186 24 Z" fill="url(#au)"/>
        <path d="M189 11 H211 V24 C211 32 205 37 200 40.5 C195 37 189 32 189 24 Z" fill="#7a0c1e"/>
        <path d="M189 11 H211 V24 C211 32 205 37 200 40.5 C195 37 189 32 189 24 Z" fill="url(#ru)" opacity=".55"/>
        <path d="M200 15 v20 M193 22 h14" stroke="url(#au)" stroke-width="2.6"/>
        ${pearl(186, 8, 1.6)}${pearl(214, 8, 1.6)}${pearl(200, 5.5, 1.8)}`],
    ];

    const svg = (h, body) => `<svg viewBox="0 0 400 ${h}" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
    document.getElementById('list').innerHTML = options.map(([title, what, h, body]) => `
      <section class="opt">
        <h2>${title}</h2>
        <p class="what">${what}</p>
        <div class="big">${svg(h, body)}</div>
        <div class="demo">
          <div class="tag">O noapte. Un Conte. Nicio încredere.</div>
          <div class="small">${svg(h, body)}</div>
          <div class="lbl">Porțile castelului se deschid în</div>
          <div class="card-h">Jucătorii</div>
          <div class="tiny">${svg(h, body)}</div>
        </div>
      </section>`).join('');
  </script>
</body>
</html>
