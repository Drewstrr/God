<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Blackwood – Urgență</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap" style="max-width:860px">
    <h1>🚨 Panoul de urgență</h1>
    <div id="login"></div>
    <div id="gate" hidden></div>
    <div id="panel" hidden>
      <div class="card warn">
        <b>⚠️ Aici se văd toate secretele jocului.</b> Folosește pagina doar în caz de forță majoră și nu o arăta jucătorilor.
        <button class="btn small ghost" id="lock" style="margin-left:8px">🔒 Închide</button>
      </div>
      <div class="card">
        <h2 id="phase">Jocul</h2>
        <div class="ctl-actions">
          <button class="btn ghost" id="restart-night">🌑 Repornește noaptea (toți aleg din nou)</button>
          <button class="btn ghost" id="restart-vote">🗳️ Repornește votul de la zero</button>
        </div>
      </div>
      <div class="card">
        <h2>Jucătorii și secretele</h2>
        <table class="rows"><tbody id="rows"></tbody></table>
      </div>
    </div>
  </main>

  <script type="module">
    import { r, onValue, get, set, requireEngineLogin } from './js/fb.js';
    import { sendCommand } from './js/game-host.js';
    import { ROLES } from './js/engine.js';
    import { hashPin } from './js/pin-service.js';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const KEY = 'blackwood-admin-open';
    const PHASES = {
      lobby: 'Așteptare', intro: 'Introducere', day: 'Petrecere', night: 'Noaptea', morning: 'Dimineața', discussion: 'Discuția',
      vote: 'Votul', reveal: 'Dezvăluirea', sacrifice: 'Eliminarea', elimination: 'Eliminat', end: 'Final',
    };

    await requireEngineLogin(document.getElementById('login'));

    // A doua parolă, separată de cea a motorului. Se alege la prima deschidere.
    const gate = document.getElementById('gate');
    const stored = (await get(r('secret/adminPass'))).val();
    const open = () => { gate.hidden = true; document.getElementById('panel').hidden = false; start(); };
    const isOpen = () => { try { return sessionStorage.getItem(KEY) === '1'; } catch { return false; } };
    if (stored && isOpen()) open();
    else {
      gate.hidden = false;
      gate.innerHTML = `
        <form class="card">
          <h2>${stored ? '🔑 Parola de urgență' : '🔑 Alege parola de urgență'}</h2>
          <p class="muted">${stored ? 'Introdu parola panoului de urgență.' : 'E diferită de parola motorului. Dă-o unei persoane de încredere care nu joacă sau păstreaz-o tu pentru situații grave.'}</p>
          <input type="password" name="pw" placeholder="Parola" required minlength="4">
          ${stored ? '' : '<input type="password" name="pw2" placeholder="Încă o dată" required minlength="4">'}
          <button class="btn">Deschide</button>
          <p class="error" id="err"></p>
        </form>`;
      gate.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target;
        const err = document.getElementById('err');
        if (!stored && f.pw.value !== f.pw2.value) { err.textContent = 'Parolele nu se potrivesc.'; return; }
        const h = await hashPin('admin', f.pw.value);
        if (!stored) await set(r('secret/adminPass'), h);
        else if (h !== stored) { err.textContent = 'Parolă greșită.'; return; }
        try { sessionStorage.setItem(KEY, '1'); } catch {}
        open();
      });
    }

    document.getElementById('lock').addEventListener('click', () => {
      try { sessionStorage.removeItem(KEY); } catch {}
      location.reload();
    });

    function start() {
      let pub = {};
      let state = null;
      let actions = {};
      let stopActions = null;

      const render = () => {
        document.getElementById('phase').textContent = `Faza: ${PHASES[pub.phase] ?? pub.phase ?? '—'}${pub.round ? ` · runda ${pub.round}` : ''}`;
        document.getElementById('restart-night').disabled = pub.phase !== 'night';
        document.getElementById('restart-vote').disabled = !['vote', 'reveal'].includes(pub.phase);
        const name = (id) => state?.players?.find((p) => p.id === id)?.name ?? id;
        const rows = (state?.players ?? []).map((p) => {
          const role = ROLES[state.roles?.[p.id]];
          const alive = pub.alive?.[p.id];
          const a = actions[p.id];
          const act = pub.phase === 'night' && a
            ? [a.target ? `→ ${esc(name(a.target))}` : '', a.hint ? `indiciu „${esc(a.hint)}”` : '', a.bet ? `pariu: ${esc(name(a.bet))}` : '', a.done ? '✓' : '…'].filter(Boolean).join(' · ')
            : '';
          return `
            <tr>
              <td><b>${esc(p.name)}</b><br><span class="${role?.team === 'evil' ? 'error' : 'muted'}">${role ? `${role.emoji} ${role.name}` : '—'}</span></td>
              <td>${alive ? '<span class="pill on">viu</span>' : '<span class="pill">👻 mort</span>'}<br><small class="muted">${act}</small></td>
              <td style="text-align:right">
                ${alive ? `<button class="btn small ghost" data-cmd="adminKill" data-id="${p.id}">💀 Marchează mort</button>`
                        : `<button class="btn small" data-cmd="adminRevive" data-id="${p.id}">✨ Reînvie</button>`}
                ${pub.phase === 'night' && a ? `<button class="btn small ghost" data-cmd="adminCancelAction" data-id="${p.id}">↩️ Anulează alegerea</button>` : ''}
              </td>
            </tr>`;
        }).join('');
        document.getElementById('rows').innerHTML = rows || '<tr><td class="muted">Jocul nu a început.</td></tr>';
        document.querySelectorAll('#rows [data-cmd]').forEach((b) => b.addEventListener('click', () => {
          const labels = { adminKill: 'marchezi mort pe', adminRevive: 'reînvii pe', adminCancelAction: 'anulezi alegerea de noapte a lui' };
          if (!confirm(`Sigur ${labels[b.dataset.cmd]} ${name(b.dataset.id)}?`)) return;
          b.disabled = true;
          sendCommand(b.dataset.cmd, { id: b.dataset.id });
        }));
      };

      onValue(r('secret/state'), (snap) => { state = snap.val(); render(); });
      onValue(r('public'), (snap) => {
        const round = pub.round;
        pub = snap.val() ?? {};
        if (pub.round !== round || !stopActions) {
          stopActions?.();
          stopActions = pub.round ? onValue(r(`actions/${pub.round}`), (s) => { actions = s.val() ?? {}; render(); }) : null;
        }
        render();
      });

      document.getElementById('restart-night').addEventListener('click', () => {
        if (confirm('Repornești noaptea? Toate alegerile de până acum se șterg și toți aleg din nou.')) sendCommand('adminRestartNight');
      });
      document.getElementById('restart-vote').addEventListener('click', () => {
        if (confirm('Repornești votul? Voturile de până acum se șterg și se votează din nou, într-o ordine nouă.')) sendCommand('adminRestartVote');
      });
    }
  </script>
</body>
</html>
