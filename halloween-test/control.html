<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Balul Contelui – Panou</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js"></script>
</head>
<body>
  <main class="wrap" style="max-width:760px">
    <h1>Panoul de comandă</h1>
    <button class="btn small ghost" id="links-btn">🔗 Linkuri</button>
    <div class="card links" id="links" hidden></div>
    <div id="login"></div>
    <div id="panel" hidden>
      <div class="card">
        <p id="engine" class="muted">Se verifică motorul…</p>
        <p class="muted">Motorul rulează în pagina <a href="screen" target="_blank">Proiector</a>. Ține-o deschisă pe ecranul proiectorului.</p>
        <button class="btn small ghost" id="sound">🔊 Sunet proiector</button>
        <button class="btn small ghost" id="music">🎵 Muzică</button>
      </div>
      <div class="card">
        <h2 id="phase-title">Jocul</h2>
        <div class="ctl-actions" id="actions"></div>
      </div>
      <div class="card">
        <h2>Jucătorii</h2>
        <p class="muted" id="players-help"></p>
        <table class="rows"><tbody id="players"></tbody></table>
      </div>
    </div>
  </main>

  <script type="module">
    import { r, onValue, set, requireEngineLogin, serverNow } from './js/fb.js';
    import { resetPin } from './js/pin-service.js';
    import { sendCommand } from './js/game-host.js';
    import { ROLES, ROLE_PRIORITY, recommendedRoles, MIN_PLAYERS } from './js/engine.js';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

    // Toate paginile jocului, cu link de deschis, copiat sau scanat (QR).
    const base = location.href.replace(/[^/]*([?#].*)?$/, '');
    const LINKS = [
      ['📽️', 'Proiector + motor', 'screen', 'Pe MacBook, pe ecranul proiectorului. Deschis într-un singur loc.'],
      ['📱', 'Telefon (jucători)', 'play', 'Pentru invitați: aleg numele și PIN-ul. E și codul QR din lobby.'],
      ['🗳️', 'Cabina de vot (iPad)', 'vote', 'Pe iPad, în Guided Access. Aici se votează pe rând.'],
      ['🎛️', 'Panoul de comandă', 'control', 'Pagina asta. Nu arată niciun secret.'],
      ['🚨', 'Panoul de urgență', 'admin', 'Parolă separată. Arată secretele: doar în caz de forță majoră.'],
      ['📖', 'Ghidul jucătorului (PDF)', 'ghid-jucatori.pdf', 'De trimis invitaților sau de printat.'],
    ];
    const linksBox = document.getElementById('links');
    linksBox.innerHTML = `<h2>🔗 Linkurile jocului</h2>${LINKS.map(([icon, name, path, help]) => `
      <div class="link-row">
        <div class="link-text"><b>${icon} ${name}</b><br><a href="${base + path}" target="_blank">${base + path}</a><br><span class="muted">${help}</span></div>
        <div class="link-actions">
          <button class="btn small ghost" data-copy="${base + path}">📋 Copiază</button>
          <button class="btn small ghost" data-qr="${base + path}">▦ QR</button>
        </div>
      </div>`).join('')}<div class="link-qr" id="link-qr" hidden></div>`;
    document.getElementById('links-btn').addEventListener('click', () => { linksBox.hidden = !linksBox.hidden; });
    linksBox.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '✓ Copiat'; } catch { prompt('Copiază linkul:', b.dataset.copy); }
      setTimeout(() => { b.textContent = '📋 Copiază'; }, 1500);
    }));
    linksBox.querySelectorAll('[data-qr]').forEach((b) => b.addEventListener('click', () => {
      const box = document.getElementById('link-qr');
      const qr = window.qrcode(0, 'M');
      qr.addData(b.dataset.qr);
      qr.make();
      box.innerHTML = `<div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div><p class="muted">${b.dataset.qr}<br>Scanează cu camera telefonului sau a iPad-ului.</p><button class="btn small ghost" id="qr-close">Închide</button>`;
      box.hidden = false;
      box.querySelector('#qr-close').addEventListener('click', () => { box.hidden = true; });
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));

    await requireEngineLogin(document.getElementById('login'));
    document.getElementById('panel').hidden = false;

    let pub = {};
    const TITLES = {
      lobby: '⏳ Așteptăm jucătorii', intro: '📜 Introducerea', day: '🎭 Balul (între ședințe)',
      night: '🌑 Noaptea', morning: '☀️ Dimineața', discussion: '💬 Discuția', end: '🏁 Final',
      vote: '🗳️ Votul', reveal: '🎭 Dezvăluirea', sacrifice: '⏳ Eliminarea', elimination: '⚰️ Eliminat',
    };

    const inLineup = (id) => pub.lineup?.players?.[id] !== false;
    const chosenRoles = () => Object.values(pub.lineup?.roles ?? {});

    // Cine joacă și cu ce personaje: se alege înainte de start.
    function lineupHtml() {
      const all = Object.entries(pub.players ?? {});
      const n = all.filter(([id]) => inLineup(id)).length;
      const roles = chosenRoles();
      const using = roles.length ? roles : recommendedRoles(n);
      const ok = n >= MIN_PLAYERS && using.length === n && using.includes('vampire');
      return `
        <div class="lineup">
          <h3>👥 Cine joacă (${n})</h3>
          <div class="chips">${all.map(([id, p]) => `<button class="chip ${inLineup(id) ? 'on' : ''}" data-play="${id}">${esc(p.name)}</button>`).join('')}</div>
          <h3>🎭 Personajele din joc (${using.length} din ${n} necesare)</h3>
          <p class="muted">${roles.length ? 'Alese de tine.' : 'Se folosesc cele recomandate pentru acest număr de jucători.'} Apasă pe un personaj ca să-l scoți sau să-l adaugi.</p>
          <div class="chips">${ROLE_PRIORITY.map((k) => `<button class="chip ${using.includes(k) ? 'on' : ''} ${ROLES[k].team === 'evil' ? 'evil' : ''}" data-role="${k}" ${k === 'vampire' ? 'disabled' : ''}>${ROLES[k].emoji} ${ROLES[k].name}</button>`).join('')}</div>
          <button class="btn small ghost" id="recommend">✨ Folosește personajele recomandate pentru ${n} jucători</button>
          ${n < MIN_PLAYERS ? `<p class="error">Sunt necesari cel puțin ${MIN_PLAYERS} jucători.</p>` : using.length !== n ? `<p class="error">Alege exact ${n} personaje (acum sunt ${using.length}).</p>` : ''}
        </div>`;
    }

    function lineupReady() {
      const n = Object.keys(pub.players ?? {}).filter(inLineup).length;
      const roles = chosenRoles();
      const using = roles.length ? roles : recommendedRoles(n);
      return n >= MIN_PLAYERS && using.length === n;
    }

    function sendLineup(players, roles) {
      sendCommand('lineup', { players, roles });
    }

    function actionsFor(phase) {
      const players = Object.entries(pub.players ?? {}).filter(([id]) => inLineup(id)).map(([, p]) => p);
      const ready = players.filter((p) => p.hasPin || p.bot).length;
      const s = pub.settings ?? {};
      const round = pub.round ?? 1;
      const sessions = s.sessions ?? 4;
      switch (phase) {
        case 'lobby': return `
          <p>${ready} din ${players.length} jucători gata (cu PIN sau robot).</p>
          <div class="row">
            <button class="btn small" data-cmd="fillBots">🤖 Completează cu roboți</button>
            <button class="btn small ghost" data-cmd="clearBots">Scoate roboții</button>
          </div>
          <div class="row">
            Ședințe <input type="number" id="s-sessions" value="${s.sessions ?? 4}" min="1" max="8">
            Noapte (sec) <input type="number" id="s-night" value="${s.nightSeconds ?? 90}" min="20" max="600">
            Discuție (sec) <input type="number" id="s-disc" value="${s.discussionSeconds ?? 300}" min="30" max="1800">
            <button class="btn small ghost" id="save-settings">Salvează</button>
          </div>
          ${lineupHtml()}
          <button class="btn" data-cmd="start" ${ready < players.length || !lineupReady() ? 'disabled' : ''}>▶️ Pornește jocul</button>`;
        case 'intro': return `
          <p class="muted">Proiectorul arată povestea, regulile și Pârcălabul. Fiecare își vede rolul pe telefon.</p>
          <button class="btn" data-cmd="party">🎭 Începe balul</button>
          <button class="btn ghost" data-cmd="session">🔔 Pornește direct prima ședință</button>`;
        case 'day': return `
          <p>Urmează ședința ${round} din ${sessions}.</p>
          <button class="btn" data-cmd="session">🔔 Pornește ședința ${round}</button>`;
        case 'night': return `
          <p class="lead" style="font-size:1.3rem">${pub.progress?.done ?? 0} / ${pub.progress?.total ?? 0} au ales · <span data-ends="${pub.endsAt ?? ''}"></span></p>
          <p class="muted">Noaptea se încheie singură când aleg toți sau expiră timpul.</p>
          <button class="btn ghost" data-cmd="endNight" data-confirm="Închei noaptea acum? Cine n-a ales pierde acțiunea.">⏹ Încheie noaptea acum</button>`;
        case 'morning': return `
          <p class="muted">Proiectorul arată anunțurile pe rând.</p>
          <button class="btn" data-cmd="discussion">💬 Pornește discuția</button>`;
        case 'discussion': return `
          <p class="lead" style="font-size:1.3rem">Timp rămas: <span data-ends="${pub.endsAt ?? ''}"></span></p>
          <button class="btn" data-cmd="startVote">🗳️ Pornește votul</button>`;
        case 'vote': {
          const v = pub.vote ?? {};
          const cur = v.order?.[v.current];
          const done = (v.done ?? 0) >= (v.total ?? 0);
          return `
            <p class="lead" style="font-size:1.3rem">${v.stage === 'revote' ? 'Revot' : 'Vot'}: ${v.done ?? 0} / ${v.total ?? 0}</p>
            ${cur ? `<p>Acum votează pe iPad: <b>${esc(cur.name)}</b></p>
              <button class="btn small ghost" data-cmd="skipVoter" data-confirm="Treci peste ${esc(cur.name)}? Votul lui contează ca abținere.">⏭ Sari peste ${esc(cur.name)} (abținere)</button>` : ''}
            <button class="btn" data-cmd="reveal" ${done ? '' : 'disabled'}>🎭 Dezvăluie voturile</button>`;
        }
        case 'reveal': {
          const o = pub.reveal?.outcome ?? {};
          if (o.result === 'eliminate') return `
            <p>Rezultat: <b>${esc(o.target)}</b>${o.byMayor ? ' (decizia Pârcălabului)' : ''}. Așteaptă să se termine dezvăluirea pe proiector.</p>
            <button class="btn" data-cmd="execute">⚰️ Execută eliminarea</button>`;
          if (o.result === 'revote') return `
            <p>Egalitate între <b>${(o.candidates ?? []).map(esc).join(', ').replace(/, ([^,]*)$/, ' și $1')}</b>.</p>
            <button class="btn" data-cmd="revote">⚖️ Pornește revotul</button>`;
          if (o.result === 'mayor-decides') return '<p>🗝️ Așteptăm decizia Pârcălabului pe telefonul lui…</p>';
          return `
            <p>Nimeni nu e eliminat.</p>
            <div class="row">Următoarea ședință peste <input type="number" id="next-min" value="45" min="0" max="180"> minute (0 = fără cronometru)</div>
            <button class="btn" id="next-session">⏭ Continuă</button>`;
        }
        case 'sacrifice': return `<p class="lead" style="font-size:1.3rem">⏳ Suspans… <span data-ends="${pub.endsAt ?? ''}"></span></p>`;
        case 'elimination': return `
          <p>${esc(pub.elimination?.name)} a fost eliminat.</p>
          <div class="row">Următoarea ședință peste <input type="number" id="next-min" value="45" min="0" max="180"> minute (0 = fără cronometru)</div>
          <button class="btn" id="next-session">⏭ Continuă</button>`;
        case 'end': {
          const st = pub.endStage ?? 'winner';
          const stepBtn = (stage, label) => `<button class="btn ${st === stage ? '' : 'ghost'}" data-end="${stage}">${label}</button>`;
          return `
            <p>${pub.winner === 'good' ? '🕯️ A câștigat binele.' : '🩸 A câștigat răul.'} Arată pe rând:</p>
            <div class="ctl-actions">
              ${stepBtn('winner', '🏁 Câștigătorul')}
              ${stepBtn('roles', '🎭 Dezvăluie toate rolurile')}
              ${stepBtn('replay', '📜 Reluarea nopților și a voturilor')}
              ${stepBtn('titles', '🏅 Titlurile serii')}
            </div>
            <hr style="border-color:var(--line);margin:14px 0">
            <button class="btn small ghost" data-cmd="reset" data-confirm="Începi un joc nou? PIN-urile rămân.">🔄 Joc nou</button>`;
        }
        default: return '';
      }
    }

    function render() {
      const phase = pub.phase ?? 'lobby';
      document.getElementById('phase-title').textContent = TITLES[phase] ?? 'Jocul';
      const box = document.getElementById('actions');
      box.innerHTML = actionsFor(phase) + (phase !== 'lobby' && phase !== 'end'
        ? '<hr style="border-color:var(--line);margin:14px 0"><button class="btn small ghost" data-cmd="reset" data-confirm="Oprești jocul și începi de la zero? PIN-urile rămân.">🔄 Oprește și începe un joc nou</button>'
        : '');
      box.querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', async () => {
        if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
        b.disabled = true;
        await sendCommand(b.dataset.cmd);
      }));
      box.querySelectorAll('[data-play]').forEach((b) => b.addEventListener('click', () => {
        const players = Object.fromEntries(Object.keys(pub.players ?? {}).map((id) => [id, inLineup(id)]));
        players[b.dataset.play] = !players[b.dataset.play];
        // Lista de personaje se resetează la cea recomandată când se schimbă numărul de jucători.
        sendLineup(players, []);
      }));
      box.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => {
        const n = Object.keys(pub.players ?? {}).filter(inLineup).length;
        const current = chosenRoles().length ? chosenRoles() : recommendedRoles(n);
        const k = b.dataset.role;
        const roles = current.includes(k) ? current.filter((x) => x !== k) : [...current, k];
        sendLineup(pub.lineup?.players ?? {}, roles);
      }));
      box.querySelectorAll('[data-end]').forEach((b) => b.addEventListener('click', () => sendCommand('endStage', { stage: b.dataset.end })));
      box.querySelector('#recommend')?.addEventListener('click', () => sendLineup(pub.lineup?.players ?? {}, []));
      box.querySelector('#save-settings')?.addEventListener('click', () => sendCommand('settings', {
        settings: {
          sessions: +document.getElementById('s-sessions').value,
          nightSeconds: +document.getElementById('s-night').value,
          discussionSeconds: +document.getElementById('s-disc').value,
        },
      }));
      box.querySelector('#next-session')?.addEventListener('click', (e) => {
        e.target.disabled = true;
        sendCommand('continue', { minutes: +document.getElementById('next-min').value || 0 });
      });
      renderPlayers();
    }

    function renderPlayers() {
      const players = Object.entries(pub.players ?? {});
      const lobby = (pub.phase ?? 'lobby') === 'lobby';
      document.getElementById('players-help').textContent = lobby
        ? '„Resetează PIN” îl deloghează pe jucător de pe toate dispozitivele și îl lasă să-și aleagă un PIN nou. Nu vezi niciun secret.'
        : 'Lista publică: cine trăiește și cine a murit.';
      document.getElementById('players').innerHTML = players.map(([id, p]) => {
        const alive = pub.alive?.[id] !== false;
        const state = lobby
          ? (p.hasPin ? '<span class="pill on">are PIN</span>' : p.bot ? '<span class="pill">🤖 robot</span>' : '<span class="pill">fără PIN</span>')
          : !(id in (pub.alive ?? {})) ? '<span class="pill">nu joacă</span>'
          : (alive ? '<span class="pill on">în viață</span>' : '<span class="pill">👻 fantomă</span>');
        return `
          <tr>
            <td><b>${esc(p.name)}</b>${!lobby && p.bot ? ' 🤖' : ''}</td>
            <td>${state}</td>
            <td style="text-align:right">
              ${!lobby && pub.phase !== 'end' && pub.alive?.[id] ? `<button class="btn small ghost" data-leave="${id}">🚪 Pleacă</button>` : ''}
              ${p.hasPin ? `<button class="btn small" data-reset="${id}">🔄 Resetează PIN</button>` : ''}
            </td>
          </tr>`;
      }).join('');
      document.querySelectorAll('[data-leave]').forEach((b) => b.addEventListener('click', () => {
        const name = pub.players[b.dataset.leave].name;
        if (!confirm(`${name} părăsește castelul? Devine fantomă și rolul i se dezvăluie pe proiector.`)) return;
        b.disabled = true;
        sendCommand('leave', { id: b.dataset.leave });
      }));
      document.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', async () => {
        const name = pub.players[b.dataset.reset].name;
        if (!confirm(`Resetezi PIN-ul lui ${name}? Va trebui să-și aleagă unul nou.`)) return;
        b.disabled = true;
        await resetPin(b.dataset.reset);
      }));
    }

    const soundBtn = document.getElementById('sound');
    onValue(r('public/muted'), (snap) => {
      soundBtn.dataset.muted = snap.val() ? '1' : '';
      soundBtn.textContent = snap.val() ? '🔇 Sunet proiector: OPRIT (apasă să pornești)' : '🔊 Sunet proiector: PORNIT (apasă să oprești)';
    });
    soundBtn.addEventListener('click', () => set(r('public/muted'), !soundBtn.dataset.muted));
    const musicBtn = document.getElementById('music');
    onValue(r('public/music'), (snap) => {
      const off = snap.val() === false;
      musicBtn.dataset.off = off ? '1' : '';
      musicBtn.textContent = off ? '🎵 Muzică: OPRITĂ (apasă să pornești)' : '🎵 Muzică: PORNITĂ (apasă să oprești)';
    });
    musicBtn.addEventListener('click', () => set(r('public/music'), Boolean(musicBtn.dataset.off)));

    onValue(r('public/engine'), (snap) => {
      const el = document.getElementById('engine');
      const on = Boolean(snap.val()?.online);
      el.textContent = on ? `⚙️ Motorul e pornit${pub.engineInfo ? ` (pe ${pub.engineInfo.device})` : ''}. Ține Proiectorul deschis într-un SINGUR loc.` : '⚠️ Motorul e oprit. Deschide pagina Proiector.';
      el.className = on ? 'ok' : 'error';
    });

    // Redesenăm butoanele doar când se schimbă ceva relevant, ca să nu pierdem ce scrii în câmpuri.
    let lastSig = '';
    onValue(r('public'), (snap) => {
      pub = snap.val() ?? {};
      const ready = Object.values(pub.players ?? {}).filter((p) => p.hasPin || p.bot).length;
      const sig = JSON.stringify([pub.phase, pub.round, ready, pub.progress, pub.endsAt, pub.winner, pub.settings, pub.vote, pub.reveal?.outcome, pub.lineup, pub.engineInfo, pub.endStage]);
      if (sig !== lastSig) { lastSig = sig; render(); } else renderPlayers();
    });

    setInterval(() => {
      document.querySelectorAll('[data-ends]').forEach((el) => { if (+el.dataset.ends) el.textContent = fmt(+el.dataset.ends - serverNow()); });
    }, 250);
  </script>
</body>
</html>
