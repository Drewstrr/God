<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Blackwood – Panou</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap" style="max-width:760px">
    <h1>Panoul de comandă</h1>
    <div id="login"></div>
    <div id="panel" hidden>
      <div class="card">
        <p id="engine" class="muted">Se verifică motorul…</p>
        <p class="muted">Motorul rulează în pagina <a href="screen" target="_blank">Proiector</a>. Ține-o deschisă pe ecranul proiectorului.</p>
      </div>
      <div class="card">
        <h2 id="phase-title">Jocul</h2>
        <div class="ctl-actions" id="actions"></div>
      </div>
      <div class="card">
        <h2>Jucătorii</h2>
        <p class="muted" id="players-help"></p>
        <table class="rows"><tbody id="players"></tbody></table>
      </div>
    </div>
  </main>

  <script type="module">
    import { r, onValue, requireEngineLogin, serverNow } from './js/fb.js';
    import { resetPin } from './js/pin-service.js';
    import { sendCommand } from './js/game-host.js';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

    await requireEngineLogin(document.getElementById('login'));
    document.getElementById('panel').hidden = false;

    let pub = {};
    const TITLES = {
      lobby: '⏳ Așteptăm jucătorii', intro: '📜 Introducerea', day: '🎉 Petrecere (între ședințe)',
      night: '🌑 Noaptea', morning: '☀️ Dimineața', discussion: '💬 Discuția', end: '🏁 Final',
    };

    function actionsFor(phase) {
      const players = Object.values(pub.players ?? {});
      const ready = players.filter((p) => p.hasPin || p.bot).length;
      const s = pub.settings ?? {};
      const round = pub.round ?? 1;
      const sessions = s.sessions ?? 4;
      switch (phase) {
        case 'lobby': return `
          <p>${ready} din ${players.length} jucători gata (cu PIN sau robot).</p>
          <div class="row">
            <button class="btn small" data-cmd="fillBots">🤖 Completează cu roboți</button>
            <button class="btn small ghost" data-cmd="clearBots">Scoate roboții</button>
          </div>
          <div class="row">
            Ședințe <input type="number" id="s-sessions" value="${s.sessions ?? 4}" min="1" max="8">
            Noapte (sec) <input type="number" id="s-night" value="${s.nightSeconds ?? 90}" min="20" max="600">
            Discuție (sec) <input type="number" id="s-disc" value="${s.discussionSeconds ?? 300}" min="30" max="1800">
            <button class="btn small ghost" id="save-settings">Salvează</button>
          </div>
          <button class="btn" data-cmd="start" ${ready < players.length ? 'disabled' : ''}>▶️ Pornește jocul</button>`;
        case 'intro': return `
          <p class="muted">Proiectorul arată povestea, regulile și Primarul. Fiecare își vede rolul pe telefon.</p>
          <button class="btn" data-cmd="party">🎉 Începe petrecerea</button>
          <button class="btn ghost" data-cmd="session">🔔 Pornește direct prima ședință</button>`;
        case 'day': return `
          <p>Urmează ședința ${round} din ${sessions}.</p>
          <button class="btn" data-cmd="session">🔔 Pornește ședința ${round}</button>`;
        case 'night': return `
          <p class="lead" style="font-size:1.3rem">${pub.progress?.done ?? 0} / ${pub.progress?.total ?? 0} au ales · <span data-ends="${pub.endsAt ?? ''}"></span></p>
          <p class="muted">Noaptea se încheie singură când aleg toți sau expiră timpul.</p>
          <button class="btn ghost" data-cmd="endNight" data-confirm="Închei noaptea acum? Cine n-a ales pierde acțiunea.">⏹ Încheie noaptea acum</button>`;
        case 'morning': return `
          <p class="muted">Proiectorul arată anunțurile pe rând.</p>
          <button class="btn" data-cmd="discussion">💬 Pornește discuția</button>`;
        case 'discussion': return `
          <p class="lead" style="font-size:1.3rem">Timp rămas: <span data-ends="${pub.endsAt ?? ''}"></span></p>
          <p class="muted">🗳️ Votul vine în etapa următoare. Deocamdată treci direct la runda următoare.</p>
          <div class="row">Următoarea ședință peste <input type="number" id="next-min" value="45" min="0" max="180"> minute (0 = fără cronometru)</div>
          <button class="btn" id="next-session">⏭ Runda următoare</button>`;
        case 'end': return `
          <p>${pub.winner === 'good' ? '🕯️ A câștigat binele.' : '🩸 A câștigat răul.'}</p>
          <button class="btn" data-cmd="reset">🔄 Joc nou</button>`;
        default: return '';
      }
    }

    function render() {
      const phase = pub.phase ?? 'lobby';
      document.getElementById('phase-title').textContent = TITLES[phase] ?? 'Jocul';
      const box = document.getElementById('actions');
      box.innerHTML = actionsFor(phase) + (phase !== 'lobby' && phase !== 'end'
        ? '<hr style="border-color:var(--line);margin:14px 0"><button class="btn small ghost" data-cmd="reset" data-confirm="Oprești jocul și începi de la zero? PIN-urile rămân.">🔄 Oprește și începe un joc nou</button>'
        : '');
      box.querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', async () => {
        if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
        b.disabled = true;
        await sendCommand(b.dataset.cmd);
      }));
      box.querySelector('#save-settings')?.addEventListener('click', () => sendCommand('settings', {
        settings: {
          sessions: +document.getElementById('s-sessions').value,
          nightSeconds: +document.getElementById('s-night').value,
          discussionSeconds: +document.getElementById('s-disc').value,
        },
      }));
      box.querySelector('#next-session')?.addEventListener('click', (e) => {
        e.target.disabled = true;
        sendCommand('nextSession', { minutes: +document.getElementById('next-min').value || 0 });
      });
      renderPlayers();
    }

    function renderPlayers() {
      const players = Object.entries(pub.players ?? {});
      const lobby = (pub.phase ?? 'lobby') === 'lobby';
      document.getElementById('players-help').textContent = lobby
        ? '„Resetează PIN” îl deloghează pe jucător de pe toate dispozitivele și îl lasă să-și aleagă un PIN nou. Nu vezi niciun secret.'
        : 'Lista publică: cine trăiește și cine a murit.';
      document.getElementById('players').innerHTML = players.map(([id, p]) => {
        const alive = pub.alive?.[id] !== false;
        const state = lobby
          ? (p.hasPin ? '<span class="pill on">are PIN</span>' : p.bot ? '<span class="pill">🤖 robot</span>' : '<span class="pill">fără PIN</span>')
          : (alive ? '<span class="pill on">în viață</span>' : '<span class="pill">👻 fantomă</span>');
        return `
          <tr>
            <td><b>${esc(p.name)}</b>${!lobby && p.bot ? ' 🤖' : ''}</td>
            <td>${state}</td>
            <td style="text-align:right">${p.hasPin ? `<button class="btn small" data-reset="${id}">🔄 Resetează PIN</button>` : ''}</td>
          </tr>`;
      }).join('');
      document.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', async () => {
        const name = pub.players[b.dataset.reset].name;
        if (!confirm(`Resetezi PIN-ul lui ${name}? Va trebui să-și aleagă unul nou.`)) return;
        b.disabled = true;
        await resetPin(b.dataset.reset);
      }));
    }

    onValue(r('public/engine'), (snap) => {
      const el = document.getElementById('engine');
      const on = Boolean(snap.val()?.online);
      el.textContent = on ? '⚙️ Motorul e pornit.' : '⚠️ Motorul e oprit. Deschide pagina Proiector.';
      el.className = on ? 'ok' : 'error';
    });

    // Redesenăm butoanele doar când se schimbă ceva relevant, ca să nu pierdem ce scrii în câmpuri.
    let lastSig = '';
    onValue(r('public'), (snap) => {
      pub = snap.val() ?? {};
      const ready = Object.values(pub.players ?? {}).filter((p) => p.hasPin || p.bot).length;
      const sig = JSON.stringify([pub.phase, pub.round, ready, pub.progress, pub.endsAt, pub.winner, pub.settings]);
      if (sig !== lastSig) { lastSig = sig; render(); } else renderPlayers();
    });

    setInterval(() => {
      document.querySelectorAll('[data-ends]').forEach((el) => { if (+el.dataset.ends) el.textContent = fmt(+el.dataset.ends - serverNow()); });
    }, 250);
  </script>
</body>
</html>
