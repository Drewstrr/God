<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Blackwood – Proiector</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js"></script>
</head>
<body class="screen">
  <div class="wrap" id="login"></div>
  <div class="screen-wrap" id="stage" hidden></div>
  <div class="status-dot" id="status">⚙️ motor oprit</div>

  <script type="module">
    import { r, onValue, requireEngineLogin, serverNow } from './js/fb.js';
    import { ensurePlayers, announceEngine, startPinService } from './js/pin-service.js';
    import { startHost } from './js/game-host.js';
    import * as sfx from './js/sfx.js';
    import { candleSVG, animateFlames } from './js/candles.js';
    import { smokeAt } from './js/smoke.js';
    import { startBlood, stopBlood } from './js/blood.js';
    import { heartSVG, beat } from './js/heart.js';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const stage = document.getElementById('stage');
    const joinUrl = `${location.host}${location.pathname.replace(/screen(\.html)?$/, 'play')}`;
    // Codul QR cu adresa paginii pentru telefoane.
    const qrSvg = (() => {
      try {
        const qr = window.qrcode(0, 'M');
        qr.addData(`${location.protocol}//${joinUrl}`);
        qr.make();
        return qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      } catch { return ''; }
    })();

    await requireEngineLogin(document.getElementById('login'));
    stage.hidden = false;

    await ensurePlayers();
    announceEngine((connected) => {
      document.getElementById('status').textContent = connected ? '⚙️ motor pornit' : '⚠️ fără internet';
    });
    startPinService();
    await startHost({
      onPassive: () => {
        const bar = document.createElement('div');
        bar.className = 'passive-bar';
        bar.textContent = '⚠️ Proiectorul a fost deschis în altă parte. Motorul lucrează acolo; aici doar se afișează. Reîncarcă pagina ca să preiei motorul aici.';
        document.body.appendChild(bar);
      },
    });

    let pub = {};
    let shownMorning = null;
    let ticker = null;

    const fmt = (ms) => {
      const s = Math.max(0, Math.ceil(ms / 1000));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    };

    // Valori „aleatorii” stabile pentru fiecare nume, ca flăcările să nu pâlpâie toate la fel.
    const seeded = (str, n) => { let h = 0; for (const c of str + n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 1000) / 1000; };

    animateFlames();
    const candleHtml = (name, cls, label, index) => candleSVG(name, { cls, label, index });

    // Două rânduri cât mai egale: 11 -> 5 sus și 6 jos.
    function candles({ lobby = false } = {}) {
      // În lobby: doar cei care joacă; în joc: cei din partidă.
      const players = Object.entries(pub.players ?? {}).filter(([id]) => (lobby ? pub.lineup?.players?.[id] !== false : id in (pub.alive ?? {})));
      const items = players.map(([id, p], i) => {
        const cls = lobby ? (p.hasPin || p.bot ? '' : 'waiting') : (pub.alive?.[id] === false ? 'out' : '');
        return candleHtml(p.name, cls, `${esc(p.name)}${lobby && p.bot ? ' <span class="bot">🤖</span>' : ''}`, i);
      });
      const top = Math.floor(items.length / 2);
      const rows = items.length > 6 ? [items.slice(0, top), items.slice(top)] : [items];
      return `<div class="candle-rows">${rows.map((row) => `<div class="candle-row">${row.join('')}</div>`).join('')}</div>`;
    }

    // Dacă nu încape totul pe proiector, micșorăm lumânările până încape.
    // Totul (titlu, cronometru, lumânări, nume) trebuie să încapă între 3% și 94% din înălțimea ecranului;
    // unele televizoare taie marginile, de aceea lăsăm loc.
    // Lumânările se așază pe unul sau două rânduri, cum ies mai mari, și se micșorează doar cât să încapă.
    // Totul trebuie să rămână între 3% și 94% din înălțime (unele televizoare taie marginile).
    function fitStage() {
      const holder = stage.querySelector('.candle-rows');
      if (!holder) return;
      const candles = [...holder.querySelectorAll('.candle')];
      const arrange = (rowCount) => {
        const per = Math.ceil(candles.length / rowCount);
        const firstRow = rowCount === 2 ? Math.floor(candles.length / 2) : candles.length;
        holder.innerHTML = '';
        const sizes = rowCount === 2 ? [firstRow, candles.length - firstRow] : [per];
        let i = 0;
        for (const n of sizes) {
          const row = document.createElement('div');
          row.className = 'candle-row';
          candles.slice(i, i + n).forEach((c) => row.appendChild(c));
          i += n;
          holder.appendChild(row);
        }
      };
      const fits = () => {
        const boxes = [...stage.children, ...stage.querySelectorAll('.candle .name')].map((e) => e.getBoundingClientRect());
        const top = Math.min(...boxes.map((x) => x.top));
        const bottom = Math.max(...boxes.map((x) => x.bottom));
        const wide = [...holder.querySelectorAll('.candle-row')].every((row) => row.scrollWidth <= stage.clientWidth * 0.98);
        return top >= innerHeight * 0.03 && bottom <= innerHeight * 0.94 && wide;
      };
      const best = (rowCount) => {
        arrange(rowCount);
        let size = Math.min(innerWidth * 0.014, innerHeight * 0.02);
        stage.style.setProperty('--cs', `${size.toFixed(2)}px`);
        for (let i = 0; i < 40 && !fits(); i++) {
          size *= 0.95;
          stage.style.setProperty('--cs', `${size.toFixed(2)}px`);
        }
        return size;
      };
      const two = candles.length > 6 ? best(2) : 0;
      const one = best(1);
      if (two > one) best(2);
    }
    window.addEventListener('resize', fitStage);
    document.fonts?.ready.then(fitStage);
    // Verificăm din nou periodic (fonturile sau textele se pot schimba după afișare).
    setInterval(() => {
      const names = stage.querySelectorAll('.candle .name');
      if (names.length && [...names].pop().getBoundingClientRect().bottom > window.innerHeight * 0.94) fitStage();
    }, 1500);

    // Din când în când, o adiere face o flacără să tremure mai tare.
    setInterval(() => {
      const lit = [...document.querySelectorAll('.candle-rows .candle:not(.out):not(.waiting)')];
      const c = lit[Math.floor(Math.random() * lit.length)];
      if (!c) return;
      c.classList.add('gust');
      setTimeout(() => c.classList.remove('gust'), 450 + Math.random() * 500);
    }, 1400);

    // Ceremonia morții: lumânarea apare, se aprinde puternic, se stinge, apoi apare încet numele.
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));
    async function ceremony(name, sub = '') {
      const box = document.createElement('div');
      box.className = 'ceremony';
      box.innerHTML = `${candleSVG(name, { label: null })}<div class="ceremony-name">${esc(name)}</div><div class="ceremony-sub">${sub}</div>`;
      document.body.appendChild(box);
      const candle = box.querySelector('.candle');
      candle.dataset.state = 'small';
      sfx.duckMusic(9);
      sfx.death();
      await wait(100); candle.classList.add('appear');
      await wait(500); candle.dataset.state = 'normal';
      await wait(500); candle.dataset.state = 'flare';
      await wait(1400); candle.dataset.state = 'dying';
      await wait(600); candle.dataset.state = 'dead';
      // Fumul pornește din vârful fitilului.
      const ember = candle.querySelector('.c-ember').getBoundingClientRect();
      smokeAt(ember.left + ember.width / 2, ember.top, { seconds: 3.2, scale: Math.max(1, innerHeight / 700) });
      await wait(1100); box.querySelector('.ceremony-name').classList.add('show');
      await wait(1800); box.querySelector('.ceremony-sub').classList.add('show');
      await wait(2600); box.classList.add('leaving');
      await wait(1200); box.remove();
    }

    // Efectele pașilor de final: un sunet la fiecare rol sau titlu, reluarea derulată încet.
    function endStageEffects(stage) {
      const f = pub.final ?? {};
      if (stage === 'roles') (f.roles ?? []).forEach((x, i) => setTimeout(() => (x.evil ? sfx.voteHit(0) : sfx.tick()), 400 + i * 600));
      if (stage === 'titles') (f.titles ?? []).forEach((_, i) => setTimeout(() => sfx.bell(0, 330, 3, 0.3), 500 + i * 2200));
      if (stage === 'replay') {
        const box = document.getElementById('replay');
        if (!box) return;
        const parent = box.parentElement;
        let y = 0;
        const scroll = () => {
          if (!document.body.contains(box)) return;
          const max = box.scrollHeight - parent.clientHeight;
          if (max <= 0) return;
          y = Math.min(max, y + 0.6);
          box.style.transform = `translateY(${-y}px)`;
          if (y < max) requestAnimationFrame(scroll);
        };
        setTimeout(() => requestAnimationFrame(scroll), 3000);
      }
    }

    // Bătăile inimii: sunet și imagine în același timp, tot mai repede.
    function heartbeatLoop() {
      let gap = 1100;
      const tickBeat = () => {
        if (lastPhase !== 'sacrifice') return;
        sfx.heartbeat(0, 1);
        beat(stage.querySelector('.heart'));
        gap = Math.max(480, gap * 0.95);
        setTimeout(tickBeat, gap);
      };
      setTimeout(tickBeat, 400);
    }

    // Binele a învins: explozie de lumină aurie, raze și scântei care urcă.
    function triumph() {
      document.querySelector('.triumph-layer')?.remove();
      const layer = document.createElement('div');
      layer.className = 'triumph-layer';
      let html = '<div class="triumph-rays"></div><div class="triumph-halo"></div><div class="triumph-flash"></div>';
      for (let i = 0; i < 70; i++) {
        html += `<div class="spark" style="left:${(Math.random() * 100).toFixed(1)}%;--sz:${(0.4 + Math.random() * 1.2).toFixed(2)}vw;--dur:${(5 + Math.random() * 7).toFixed(1)}s;--delay:${(Math.random() * 6).toFixed(1)}s;--dx:${(Math.random() * 30 - 15).toFixed(1)}vw"></div>`;
      }
      layer.innerHTML = html;
      document.body.prepend(layer);
      document.body.classList.add('triumph');
    }

    // Sângele care curge când răul a învins.
    function bleed() { startBlood(); }

    // Titlu gotic de sânge, cu picături care se scurg (poziții stabile pentru același text).
    function bt(text, emoji = '', { gold = false } = {}) {
      const n = gold ? 0 : 4 + Math.floor(seeded(text, 1) * 4);
      const drips = Array.from({ length: n }, (_, i) => {
        const v = (k, lo, hi) => (lo + seeded(text, 10 + i * 7 + k) * (hi - lo)).toFixed(2);
        return `<i class="bt-drip" style="left:${v(0, 4, 94)}%;--w:${v(1, 0.07, 0.15)}em;--len:${v(2, 0.3, 1.1)}em;--d:${v(3, 2.5, 6)}s;--delay:${v(4, 0.3, 2.5)}s"></i>`;
      }).join('');
      return `${emoji ? `<span class="emo">${emoji}</span> ` : ''}<span class="blood-text ${gold ? 'gold' : ''}">${esc(text)}${drips}</span>`;
    }

    function timer(label, endsAt) {
      return `<div class="big-timer"><div class="muted">${label}</div><div class="clock" data-ends="${endsAt ?? ''}">${endsAt ? fmt(endsAt - serverNow()) : ''}</div></div>`;
    }

    let lastSecond = null;
    function tick() {
      document.querySelectorAll('[data-ends]').forEach((el) => {
        const ends = Number(el.dataset.ends);
        if (!ends) return;
        const left = ends - serverNow();
        el.textContent = fmt(left);
        // Ultimele 10 secunde ticăie; la zero, o bătaie mai gravă.
        const sec = Math.ceil(left / 1000);
        if (sec !== lastSecond && sec <= 10 && sec >= 0 && ['night', 'discussion'].includes(pub.phase)) sfx.clockTick(sec === 0);
        lastSecond = sec;
        el.classList.toggle('urgent', sec <= 10);
      });
    }

    const views = {
      lobby() {
        const players = Object.entries(pub.players ?? {}).filter(([id]) => pub.lineup?.players?.[id] !== false).map(([, p]) => p);
        const ready = players.filter((p) => p.hasPin || p.bot).length;
        return `
          <h1>${bt('Conacul Blackwood')}</h1>
          <div class="join">
            <div class="qr">${qrSvg}</div>
            <div class="join-text">
              <div class="join-title">📱 Intră în conac</div>
              <ol>
                <li>Scanează codul cu camera telefonului</li>
                <li>Atinge-ți numele</li>
                <li>Alege-ți un PIN de 4 cifre</li>
              </ol>
              <div class="muted">sau scrie: <b style="color:var(--text)">${esc(joinUrl)}</b></div>
              <div class="join-count">${ready} din ${players.length} au intrat</div>
            </div>
          </div>
          ${candles({ lobby: true })}`;
      },
      intro() {
        return `
          <h1>${bt('Conacul Blackwood')}</h1>
          <div class="story">
            <p>În noaptea de Halloween, un <b>vampir</b> s-a trezit printre invitații conacului.</p>
            <p>Până la miezul nopții trebuie descoperit. Altfel, conacul va fi al lui.</p>
            <ul>
              <li>🔔 La fiecare ședință vine <b>noaptea</b>: toată lumea apasă un nume pe telefon.</li>
              <li>☀️ Dimineața aflăm cine a murit, apoi <b>discutăm</b> și <b>votăm</b>.</li>
              <li>👻 Morții nu mai vorbesc despre joc și nu mai votează.</li>
              <li>🤫 Nu-ți arăta telefonul nimănui.</li>
            </ul>
          </div>
          ${pub.mayor ? `<div class="announce">🎩 Primarul conacului este <b>${esc(pub.mayor.name)}</b><br><span class="muted">Votul lui contează dublu.</span></div>` : ''}`;
      },
      day() {
        return `
          <h1>${bt('Conacul Blackwood')}</h1>
          <p class="center muted lead">Petrecerea continuă… dar vampirul ascultă.</p>
          ${candles()}
          ${pub.nextSessionAt ? timer('Următoarea ședință în', pub.nextSessionAt) : ''}`;
      },
      night() {
        const p = pub.progress ?? { done: 0, total: 0 };
        return `
          <div class="night">
            <h1>${bt('Noaptea', '🌑')}</h1>
            <p class="lead muted">Toată lumea alege pe telefon. În liniște.</p>
            ${timer('', pub.endsAt)}
            <p class="lead">${p.done} / ${p.total} au ales</p>
          </div>`;
      },
      morning() {
        return `<h1>${bt('Dimineața', '☀️')}</h1><div class="morning" id="morning"></div>`;
      },
      discussion() {
        const m = pub.morning ?? {};
        return `
          <h1>${bt('Discuția', '💬')}</h1>
          ${timer('Timp rămas', pub.endsAt)}
          ${m.hypnotized ? `<p class="center lead">🤐 <b>${esc(m.hypnotized)}</b> e hipnotizat și nu are voie să vorbească.</p>` : ''}
          ${candles()}`;
      },
      vote() {
        const v = pub.vote ?? {};
        const order = v.order ?? [];
        return `
          <div class="squid-screen">
            <h1>${bt(v.stage === 'revote' ? 'Revotul' : 'Votul')}</h1>
            ${v.candidates ? `<p class="center lead">Doar între: <b>${v.candidates.map((c) => esc(c.name)).join(', ').replace(/, ([^,]*)$/, ' și $1')}</b></p>` : ''}
            <div class="squid-count">${v.done ?? 0} / ${v.total ?? 0}</div>
            <p class="center lead muted">Votați pe rând, pe iPad, în ordinea asta:</p>
            <div class="vote-order">${order.map((o, i) => `<span class="${i < v.current ? 'done' : i === v.current ? 'now' : ''}">${esc(o.name)}</span>`).join('')}</div>
          </div>`;
      },
      reveal() {
        return `<div class="squid-screen"><h1>${bt('Dezvăluirea')}</h1><div class="reveal-grid"><div id="reveal-list" class="reveal-list"></div><div id="tally" class="tally"></div></div><div id="outcome"></div></div>`;
      },
      sacrifice() {
        return `
          <div class="squid-screen center" style="margin:auto">
            <p class="lead muted">Conacul a ales.</p>
            <h1>${bt(pub.doomedName ?? '')}</h1>
            <p class="lead">Soarta se decide…</p>
            <div class="heart-wrap">${heartSVG}</div>
          </div>`;
      },
      elimination() {
        const e = pub.elimination ?? {};
        if (e.sacrificed) {
          return `
            <div class="squid-screen center" style="margin:auto">
              <h1>${bt('Servitorul s-a aruncat în fața stăpânului său!', '🩸')}</h1>
              <p class="lead"><b>${esc(e.name)}</b> moare în locul lui. Rolul: ${e.emoji} <b>${esc(e.roleName)}</b></p>
              <p class="lead squid-pink">${esc(e.vampire)} rămâne în viață…</p>
              ${e.testament ? `<div class="testament">„${esc(e.testament)}”</div>` : ''}
            </div>`;
        }
        return `
          <div class="squid-screen center" style="margin:auto">
            <p class="lead muted">Eliminat din conac</p>
            <h1>${bt(e.name ?? '')}</h1>
            <div class="role-reveal ${e.evil ? 'evil' : ''}">${e.emoji} ${esc(e.roleName)}</div>
            ${e.testament ? `<div class="testament">„${esc(e.testament)}”</div>` : ''}
          </div>`;
      },
      end() {
        const good = pub.winner === 'good';
        const f = pub.final ?? {};
        const stage = pub.endStage ?? 'winner';
        const head = `<div class="end ${good ? 'good' : 'evil'} ${stage === 'winner' ? '' : 'small'}">
            <h1>${good ? bt('Binele a învins', '🕯️', { gold: true }) : bt('Răul a învins', '🩸')}</h1>
            ${stage === 'winner' ? `<p class="lead">${good ? 'Vampirul a fost alungat din conac.' : 'Conacul Blackwood aparține acum vampirului.'}</p>` : ''}
          </div>`;
        if (stage === 'roles') {
          return `${head}<div class="final-roles">${(f.roles ?? []).map((x, i) => `
            <div class="role-tile ${x.evil ? 'evil' : ''} ${x.alive ? '' : 'dead'}" style="animation-delay:${0.4 + i * 0.6}s">
              <div class="emoji">${x.emoji}</div><div class="who">${esc(x.name)}</div><div class="what">${esc(x.roleName)}</div>
              ${x.alive ? '' : '<div class="rip">💀</div>'}
            </div>`).join('')}</div>`;
        }
        if (stage === 'replay') {
          return `${head}<div class="replay-box"><div class="replay" id="replay">${(f.replay ?? []).map((b) => `
            <div class="replay-block"><h3>${esc(b.title)}</h3>${b.lines.map((l) => `<p>${esc(l)}</p>`).join('')}</div>`).join('')}</div></div>`;
        }
        if (stage === 'titles') {
          const bets = (f.bets ?? []).filter((b) => b.correct > 0).slice(0, 3);
          return `${head}<div class="titles">${(f.titles ?? []).map((t, i) => `
            <div class="title-card" style="animation-delay:${0.5 + i * 2.2}s">
              <div class="emoji">${t.emoji}</div>
              <div class="t">${esc(t.title)}</div>
              <div class="n">${t.names.map(esc).join(', ')}</div>
              <div class="why">${esc(t.why)}</div>
            </div>`).join('')}</div>
            ${bets.length ? `<p class="center lead bets-line">🎲 Cele mai bune pariuri: ${bets.map((b) => `<b>${esc(b.name)}</b> (${b.correct})`).join(' · ')}</p>` : ''}`;
        }
        return `${head}${candles()}`;
      },
    };

    function morningSlides(m) {
      const slides = [];
      if (m.deaths?.length) {
        for (const d of m.deaths) {
          slides.push(`<div class="slide death">💀 <b>${esc(d.name)}</b> a murit în noaptea asta.${d.testament ? `<div class="testament">„${esc(d.testament)}”</div>` : ''}</div>`);
        }
      } else {
        slides.push('<div class="slide">🌙 Nimeni nu a murit în noaptea asta.</div>');
      }
      if (m.saved) slides.push('<div class="slide">🛡️ Cineva a fost salvat în noaptea asta.</div>');
      if (m.hypnotized) slides.push(`<div class="slide">🤐 <b>${esc(m.hypnotized)}</b> este hipnotizat și nu are voie să vorbească la ședință.</div>`);
      if (m.gossip) slides.push(`<div class="slide">🗣️ Bârfitoarea șoptește: <i>„${esc(m.gossip)}”</i></div>`);
      if (m.hints?.length) slides.push(`<div class="slide">👻 Fantomele șoptesc: ${m.hints.map((h) => `<b>${esc(h)}</b>`).join(' · ')}</div>`);
      if (m.thermometer?.length) {
        const max = Math.max(...m.thermometer.map((t) => t.votes));
        slides.push(`<div class="slide"><div>🌡️ Ce crede conacul <span class="muted">(${m.betCount ?? ''} pariuri)</span></div>${m.thermometer.map((t) => `
          <div class="bar"><span>${esc(t.name)}</span><i style="width:${(t.votes / max) * 100}%"></i><b>${t.votes}</b></div>`).join('')}</div>`);
      }
      return slides;
    }

    async function playMorning() {
      const m = pub.morning;
      const box = document.getElementById('morning');
      if (!m || !box) return;
      const slides = morningSlides(m);
      const already = shownMorning === m.round;
      shownMorning = m.round;
      if (!already) {
        sfx.dawn();
        await wait(1500);
        for (const d of m.deaths ?? []) await ceremony(d.name, 'a murit în noaptea asta');
      }
      slides.forEach((html, i) => {
        setTimeout(() => {
          if (!document.getElementById('morning')) return;
          box.insertAdjacentHTML('beforeend', html);
        }, already ? 0 : 800 + i * 4500);
      });
    }

    // Dezvăluirea voturilor, unul câte unul, cu scorul care crește.
    let revealKey = null;
    let revealTimers = [];
    function playReveal() {
      const rv = pub.reveal;
      if (!rv) return;
      const key = `${pub.round}-${rv.stage}`;
      const instant = revealKey === key;
      revealKey = key;
      revealTimers.forEach(clearTimeout);
      revealTimers = [];
      const list = document.getElementById('reveal-list');
      const tally = {};
      let lastHit = null;
      const drawTally = () => {
        const rows = Object.entries(tally).sort((a, b) => b[1] - a[1]);
        const box = document.getElementById('tally');
        if (!box) return;
        box.innerHTML = rows.map(([n, c]) => `<div class="tally-row ${n === lastHit ? 'hit' : ''}"><span>${esc(n)}</span><b>${c}</b></div>`).join('');
      };
      const step = 2600;
      const slash = '<svg class="slash" viewBox="0 0 100 24"><path d="M2 14 C 30 4, 60 22, 86 12"/><polygon class="tip" points="84,4 99,12 84,20"/></svg>';
      rv.items.forEach((it, i) => {
        const show = () => {
          if (!document.getElementById('reveal-list')) return;
          list.insertAdjacentHTML('beforeend', `<div class="reveal-item"><span class="voter">${esc(it.voter)}${it.weight > 1 ? ' 🎩×2' : ''}</span>${it.target ? `${slash}<span class="target"><b>${esc(it.target)}</b></span>` : '<span class="target"><i class="muted">se abține</i></span>'}`);
          if (instant) {
            if (it.target) tally[it.target] = (tally[it.target] ?? 0) + it.weight;
            lastHit = null;
            return drawTally();
          }
          sfx.voteHit(it.target ? 0.75 : null);
          // Scorul crește exact când „lovește” votul.
          revealTimers.push(setTimeout(() => {
            if (it.target) {
              tally[it.target] = (tally[it.target] ?? 0) + it.weight;
              lastHit = it.target;
              document.body.insertAdjacentHTML('beforeend', '<div class="vote-flash"></div>');
              setTimeout(() => document.querySelector('.vote-flash')?.remove(), 900);
              stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
            }
            drawTally();
          }, 800));
        };
        if (instant) show(); else revealTimers.push(setTimeout(show, 1200 + i * step));
      });
      const showOutcome = () => { const box = document.getElementById('outcome'); if (box) box.innerHTML = outcomeHtml(pub.reveal?.outcome ?? rv.outcome); };
      if (instant) showOutcome(); else revealTimers.push(setTimeout(() => { showOutcome(); sfx.verdict(); }, 1200 + rv.items.length * step + 1400));
    }

    function outcomeHtml(o) {
      if (!o) return '';
      if (o.result === 'eliminate') return `<div class="outcome">${o.byMayor ? '🎩 Primarul a decis: ' : 'Conacul a votat: '}<b class="squid-pink">${esc(o.target)}</b></div>`;
      if (o.result === 'revote') return `<div class="outcome">⚖️ Egalitate între <b>${o.candidates.map(esc).join(', ').replace(/, ([^,]*)$/, ' și $1')}</b>. Urmează revotul.</div>`;
      if (o.result === 'mayor-decides') return `<div class="outcome">⚖️ Tot egalitate. 🎩 <b>Primarul decide</b> pe telefonul lui…</div>`;
      return '<div class="outcome">Nimeni nu este eliminat în această rundă.</div>';
    }

    let lastPhase = null;
    let lastEndStage = null;
    const THEME = {
      lobby: 'waltz', day: 'waltz', intro: 'organ', night: 'night', morning: 'somber', discussion: 'ticking',
      vote: 'tension', reveal: 'tension', sacrifice: null, elimination: 'somber',
    };
    function playThemeFor(phase) {
      const theme = phase === 'end' ? (pub.winner === 'good' ? 'glory' : 'doom') : THEME[phase];
      // La final, muzica pornește după efectul sonor al victoriei.
      if (phase === 'end') {
        if (sfx.musicTheme() === theme) return;
        sfx.playMusic(null);
        setTimeout(() => { if (lastPhase === 'end') sfx.playMusic(theme); }, 6000);
      }
      else sfx.playMusic(theme ?? null);
    }

    // Anunțuri scurte peste orice ecran (de exemplu cineva a părăsit conacul).
    let lastNotice = null;
    function showNotice(n) {
      if (!n || n.at === lastNotice) return;
      const fresh = lastNotice !== null;
      lastNotice = n.at;
      if (!fresh && serverNow() - n.at > 15000) return;
      const el = document.createElement('div');
      el.className = 'notice';
      el.textContent = n.text;
      document.body.appendChild(el);
      sfx.bell(0, 147, 4, 0.4);
      setTimeout(() => el.classList.add('leaving'), 7000);
      setTimeout(() => el.remove(), 8200);
    }

    let joinedBefore = null;
    onValue(r('public'), (snap) => {
      pub = snap.val() ?? {};
      const phase = pub.phase ?? 'lobby';
      showNotice(pub.notice);
      // Un clinchet când se aprinde lumânarea unui jucător nou.
      const joined = Object.values(pub.players ?? {}).filter((p) => p.hasPin || p.bot).length;
      if (phase === 'lobby' && joinedBefore !== null && joined > joinedBefore) sfx.chime();
      joinedBefore = joined;
      document.body.dataset.phase = phase;
      if (phase === 'morning' && lastPhase === 'morning') return; // nu restartăm animația
      if (phase === 'end' && lastPhase === 'end' && pub.endStage === lastEndStage) return; // finalul nu se redesenează degeaba
      const stageChanged = phase === 'end' && pub.endStage !== lastEndStage;
      lastEndStage = pub.endStage;
      if (phase === 'reveal' && lastPhase === 'reveal') {
        // Doar rezultatul se poate schimba (decizia Primarului).
        const box = document.getElementById('outcome');
        if (box && box.innerHTML) box.innerHTML = outcomeHtml(pub.reveal?.outcome);
        return;
      }
      const previous = lastPhase;
      lastPhase = phase;
      if (phase !== 'reveal') { revealTimers.forEach(clearTimeout); revealTimers = []; }
      sfx.setMuted(Boolean(pub.muted));
      sfx.setMusic(pub.music !== false);
      playThemeFor(phase);
      if (phase !== 'end') {
        stopBlood();
        document.querySelector('.triumph-layer')?.remove();
        document.body.classList.remove('triumph');
      }
      if (phase === 'night' && previous && previous !== 'night') sfx.sessionBell();
      if (phase === 'elimination' && previous === 'sacrifice' && pub.elimination) {
        // Ceremonia întâi, apoi rolul.
        const e = pub.elimination;
        stage.innerHTML = '';
        ceremony(e.name, e.sacrificed ? '🩸 s-a sacrificat pentru stăpânul său' : 'a fost eliminat din conac')
          .then(() => { if (lastPhase === 'elimination') stage.innerHTML = views.elimination(); });
        return;
      }
      stage.innerHTML = (views[phase] ?? views.lobby)();
      fitStage();
      if (phase === 'sacrifice' && previous !== 'sacrifice') heartbeatLoop();
      if (phase === 'end' && stageChanged && previous === 'end') endStageEffects(pub.endStage);
      if (phase === 'morning') playMorning();
      if (phase === 'reveal') playReveal();
      if (phase === 'end' && previous && previous !== 'end') {
        if (pub.winner === 'evil') { bleed(); sfx.evilWins(); }
        else { triumph(); sfx.goodWins(); }
      }
      if (phase === 'end' && pub.winner === 'evil' && !document.querySelector('.blood-canvas')) bleed();
      if (phase === 'end' && pub.winner === 'good' && !document.querySelector('.triumph-layer')) triumph();
      clearInterval(ticker);
      ticker = setInterval(tick, 250);
    });

    // Sunetul pornește după primul click sau tastă pe pagină (regula browserelor).
    const hint = document.createElement('div');
    hint.className = 'sound-hint';
    document.body.appendChild(hint);
    const showHint = () => { hint.textContent = sfx.ready() ? (sfx.isMuted() ? '🔇 sunet oprit din panou' : '🔊 sunet pornit') : '🔇 click oriunde pentru sunet'; };
    ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => {
      const wasReady = sfx.ready();
      sfx.unlock();
      setTimeout(() => { showHint(); if (!wasReady && sfx.ready()) playThemeFor(lastPhase ?? 'lobby'); }, 250);
    }));
    sfx.unlock();
    setInterval(showHint, 1000);

    // Un click oriunde trece proiectorul pe ecran complet.
    document.body.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    });
  </script>
</body>
</html>
